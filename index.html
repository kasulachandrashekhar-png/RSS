        }

        CREATE: 'create',

        LIST: 'list',
        GET: 'get',
        WRITE: 'write',
    };

    function handleFirestoreError(error, operationType, path) {
        const errInfo = {
            error: error instanceof Error ? error.message : String(error),
            authInfo: {
                userId: auth?.currentUser?.uid || null,
                email: auth?.currentUser?.email || null,
                emailVerified: auth?.currentUser?.emailVerified || null,
                isAnonymous: auth?.currentUser?.isAnonymous || null,
                tenantId: auth?.currentUser?.tenantId || null,
                providerInfo: auth?.currentUser?.providerData?.map(provider => ({
                    providerId: provider.providerId,
                    email: provider.email,
                })) || []
            },
            operationType,
            path
        };
        console.error('Firestore Error: ', JSON.stringify(errInfo));
        throw new Error(JSON.stringify(errInfo));
    }

    async function testConnection() {
        try {

        testConnection
    };

        window.initPortalCloudSync();

</script>

const STORAGE_KEY = 'rss_exam_portal_state_v1';
const SESSION_KEY = 'rss_exam_portal_session_v1';
var saveTimer = null;
var lastSavedAt = null;
var cloudSaveTimer = null;
var cloudSyncStatus = 'connecting';
var isCloudPushing = false;
var cloudUnsubscribers = [];
var lastCloudSyncTime = null;
var currentPageId = null;

function persistableState() {
    const { currentUser, ...rest } = state;
    return rest;
}

function updateSaveIndicator(failed, overrideStatus) {
    const el = document.getElementById('save-indicator');
    if (!el) return;
    el.classList.remove('hidden');
    el.classList.add('flex');

    if (failed || cloudSyncStatus === 'error') {
        el.innerHTML = '<i class="fas fa-exclamation-triangle text-amber-500"></i> <span class="text-amber-700 font-medium">Offline / Local Save</span>';
        el.title = 'Saved locally in browser. Click to retry cloud sync.';
        return;
    }

    if (overrideStatus === 'syncing' || isCloudPushing) {
        el.innerHTML = '<i class="fas fa-sync fa-spin text-blue-500"></i> <span class="text-blue-600 font-medium">Cloud Syncing...</span>';
        el.title = 'Synchronizing with Firebase Cloud Database';
        return;
    }

    const t = lastCloudSyncTime || lastSavedAt;
    const timeStr = t ? t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    el.innerHTML = `<i class="fas fa-cloud text-green-500"></i> <span class="text-green-700 font-medium">Cloud Synced ${timeStr}</span>`;
    el.title = 'Data safely stored in Firebase Cloud Database. Click to refresh.';
}

function saveState(immediate) {
    const doSave = () => {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(persistableState()));
            lastSavedAt = new Date();
            updateSaveIndicator(false, 'syncing');
            syncPushToCloud(immediate);
        } catch (err) {
            console.error('Auto-save failed:', err);
            updateSaveIndicator(true);
        }
    };
    if (immediate) { doSave(); return; }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 600);
}

function syncPushToCloud(immediate) {
    if (!window.portalFirebase || !window.portalFirebase.db) return;
    const doPush = async () => {
        if (isCloudPushing) return;
        isCloudPushing = true;
        updateSaveIndicator(false, 'syncing');
        try {
            const { db, doc, setDoc, handleFirestoreError, OperationType } = window.portalFirebase;
            const nowIso = new Date().toISOString();
            const author = state.currentUser ? (state.currentUser.username || state.currentUser.fullName || state.currentUser.email || 'Admin') : 'System';

            // 1. Meta settings (classes, subjects, terms, months, rules, examSettings, password)
            const metaPayload = {
                id: 'meta',
                sectionName: 'Academic Settings & Rules',
                adminPassword: state.adminPassword || 'admin',
                classes: state.classes || [],
                subjects: state.subjects || [],
                terms: state.terms || [],
                months: state.months || [],
                gradeRules: state.gradeRules || [],
                examSettings: state.examSettings || {},
                updatedAt: nowIso,
                updatedBy: author
            };
            await setDoc(doc(db, 'school_portal', 'meta'), metaPayload).catch(e => handleFirestoreError(e, OperationType.WRITE, 'school_portal/meta'));

            // 2. Students list
            const studentsPayload = {
                id: 'students',
                sectionName: 'Student Records',
                list: state.students || [],
                updatedAt: nowIso,
                updatedBy: author
            };
            await setDoc(doc(db, 'school_portal', 'students'), studentsPayload).catch(e => handleFirestoreError(e, OperationType.WRITE, 'school_portal/students'));

            // 3. Teachers list
            const teachersPayload = {
                id: 'teachers',
                sectionName: 'Teacher Records',
                list: state.teachers || [],
                updatedAt: nowIso,
                updatedBy: author
            };
            await setDoc(doc(db, 'school_portal', 'teachers'), teachersPayload).catch(e => handleFirestoreError(e, OperationType.WRITE, 'school_portal/teachers'));

            // 4. Marks records
            const marksPayload = {
                id: 'marks',
                sectionName: 'Examination Marks',
                list: state.marks || [],
                updatedAt: nowIso,
                updatedBy: author
            };
            await setDoc(doc(db, 'school_portal', 'marks'), marksPayload).catch(e => handleFirestoreError(e, OperationType.WRITE, 'school_portal/marks'));

            // 5. Attendance records
            const attendancePayload = {
                id: 'attendance',
                sectionName: 'Student Attendance',
                list: state.attendance || [],
                updatedAt: nowIso,
                updatedBy: author
            };
            await setDoc(doc(db, 'school_portal', 'attendance'), attendancePayload).catch(e => handleFirestoreError(e, OperationType.WRITE, 'school_portal/attendance'));

            lastCloudSyncTime = new Date();
            cloudSyncStatus = 'synced';
            updateSaveIndicator();
            const badge = document.getElementById('cloud-last-sync-text');
            if (badge) badge.innerHTML = `<strong>Last Sync:</strong> ${lastCloudSyncTime.toLocaleTimeString()}`;
        } catch (err) {
            console.error('Cloud push error:', err);
            cloudSyncStatus = 'error';
            updateSaveIndicator(true);
        } finally {
            isCloudPushing = false;
        }
    };

    if (immediate) { doPush(); return; }
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(doPush, 1000);
}

window.initPortalCloudSync = async function() {
    if (!window.portalFirebase || !window.portalFirebase.db) return;
    const { db, doc, getDoc, onSnapshot, handleFirestoreError, OperationType, testConnection } = window.portalFirebase;

    try {
        await testConnection();
    } catch (e) {
        console.warn('Startup probe check:', e);
    }

    updateSaveIndicator(false, 'syncing');

    try {
        const metaRef = doc(db, 'school_portal', 'meta');
        const studentsRef = doc(db, 'school_portal', 'students');
        const teachersRef = doc(db, 'school_portal', 'teachers');
        const marksRef = doc(db, 'school_portal', 'marks');
        const attendanceRef = doc(db, 'school_portal', 'attendance');

        let metaSnap, studentsSnap, teachersSnap, marksSnap, attendanceSnap;
        try {
            [metaSnap, studentsSnap, teachersSnap, marksSnap, attendanceSnap] = await Promise.all([
                getDoc(metaRef),
                getDoc(studentsRef),
                getDoc(teachersRef),
                getDoc(marksRef),
                getDoc(attendanceRef)
            ]);
        } catch (err) {
            handleFirestoreError(err, OperationType.GET, 'school_portal');
        }

        const hasCloudData = (metaSnap && metaSnap.exists()) || 
                             (studentsSnap && studentsSnap.exists()) || 
                             (teachersSnap && teachersSnap.exists()) || 
                             (marksSnap && marksSnap.exists());

        if (hasCloudData) {
            console.log("Loading school records from Firebase Cloud Database...");
            if (metaSnap && metaSnap.exists()) {
                const d = metaSnap.data();
                if (d.classes && Array.isArray(d.classes)) state.classes = d.classes;
                if (d.subjects && Array.isArray(d.subjects)) state.subjects = d.subjects;
                if (d.terms && Array.isArray(d.terms)) state.terms = d.terms;
                if (d.months && Array.isArray(d.months)) state.months = d.months;
                if (d.gradeRules && Array.isArray(d.gradeRules)) state.gradeRules = d.gradeRules;
                if (d.examSettings && typeof d.examSettings === 'object') state.examSettings = d.examSettings;
                if (d.adminPassword) state.adminPassword = d.adminPassword;
            }
            if (studentsSnap && studentsSnap.exists() && Array.isArray(studentsSnap.data().list)) {
                state.students = studentsSnap.data().list;
            }
            if (teachersSnap && teachersSnap.exists() && Array.isArray(teachersSnap.data().list)) {
                state.teachers = teachersSnap.data().list;
            }
            if (marksSnap && marksSnap.exists() && Array.isArray(marksSnap.data().list)) {
                state.marks = marksSnap.data().list;
            }
            if (attendanceSnap && attendanceSnap.exists() && Array.isArray(attendanceSnap.data().list)) {
                state.attendance = attendanceSnap.data().list;
            }

            initDummyData();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(persistableState()));
            lastCloudSyncTime = new Date();
            cloudSyncStatus = 'synced';
            updateSaveIndicator();
            refreshActivePage();
        } else {
            console.log("First time setup: Syncing local state up to Firebase Cloud Database...");
            await syncPushToCloud(true);
        }

        // Attach Real-Time onSnapshot listeners so any updates from other devices appear immediately
        cloudUnsubscribers.forEach(unsub => { if (typeof unsub === 'function') unsub(); });
        cloudUnsubscribers = [];

        const attachSectionListener = (docRef, sectionName, applyFn) => {
            const unsub = onSnapshot(docRef, (snap) => {
                if (isCloudPushing) return;
                if (snap.exists()) {
                    const data = snap.data();
                    applyFn(data);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(persistableState()));
                    lastCloudSyncTime = new Date();
                    cloudSyncStatus = 'synced';
                    updateSaveIndicator();
                    refreshActivePage();
                }
            }, (error) => {
                console.warn(`Snapshot listener note for ${sectionName}:`, error);
            });
            cloudUnsubscribers.push(unsub);
        };

        attachSectionListener(studentsRef, 'students', (data) => {
            if (Array.isArray(data.list)) state.students = data.list;
        });
        attachSectionListener(teachersRef, 'teachers', (data) => {
            if (Array.isArray(data.list)) state.teachers = data.list;
        });
        attachSectionListener(marksRef, 'marks', (data) => {
            if (Array.isArray(data.list)) state.marks = data.list;
        });
        attachSectionListener(attendanceRef, 'attendance', (data) => {
            if (Array.isArray(data.list)) state.attendance = data.list;
        });
        attachSectionListener(metaRef, 'meta', (data) => {
            if (data.classes && Array.isArray(data.classes)) state.classes = data.classes;
            if (data.subjects && Array.isArray(data.subjects)) state.subjects = data.subjects;
            if (data.terms && Array.isArray(data.terms)) state.terms = data.terms;
            if (data.months && Array.isArray(data.months)) state.months = data.months;
            if (data.gradeRules && Array.isArray(data.gradeRules)) state.gradeRules = data.gradeRules;
            if (data.examSettings && typeof data.examSettings === 'object') state.examSettings = data.examSettings;
            if (data.adminPassword) state.adminPassword = data.adminPassword;
        });

    } catch (err) {
        console.error("Cloud sync init warning:", err);
        cloudSyncStatus = 'error';
        updateSaveIndicator(true);
    }
};

window.signInWithGoogle = async function() {
    if (!window.portalFirebase || !window.portalFirebase.auth) {
        showToast('Connecting to Google Cloud Auth...', 'info');
        return;
    }
    const { auth, GoogleAuthProvider, signInWithPopup } = window.portalFirebase;
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        
        const teacherMatch = state.teachers.find(t => 
            (t.username && t.username.toLowerCase() === user.email.toLowerCase()) || 
            (t.contact && user.email.includes(t.contact)) ||
            (t.fullName && user.displayName && t.fullName.toLowerCase().includes(user.displayName.toLowerCase()))
        );

        if (teacherMatch) {
            state.currentUser = { ...teacherMatch, role: 'teacher', email: user.email };
            saveSession();
            loadApp();
            showToast(`Welcome ${teacherMatch.fullName || user.displayName}!`, 'success');
        } else {
            state.currentUser = {
                role: 'admin',
                username: user.displayName || 'Administrator',
                email: user.email
            };
            saveSession();
            loadApp();
            showToast(`Welcome ${user.displayName || 'Administrator'}! Logged in as School Admin.`, 'success');
        }
    } catch (error) {
        const code = error?.code || '';
        const msg = error?.message || '';
        if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request' || msg.includes('popup-closed-by-user') || msg.includes('cancelled-popup-request')) {
            // Intentionally closed by user, harmless event
            console.info("Google sign-in popup was closed by user.");
            showToast('Sign-in was cancelled.', 'info');
        } else if (code === 'auth/popup-blocked' || msg.includes('popup-blocked')) {
            console.warn("Google sign-in popup blocked:", msg);
            showToast('Popup was blocked by your browser. Please allow popups to sign in.', 'warning');
        } else {
            console.warn("Google sign-in notice:", msg || error);
            showToast(msg || 'Unable to sign in with Google.', 'error');
        }
    }
};

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const saved = JSON.parse(raw);
            Object.keys(saved).forEach(key => { state[key] = saved[key]; });
            return true;
        }
    } catch (err) {
        console.error('Failed to load saved data:', err);
    }
    return false;
}

function loadSession() {

        const raw = sessionStorage.getItem(SESSION_KEY);
        if (raw) { state.currentUser = JSON.parse(raw); return true; }
    } catch (err) { /* ignore */ }
    return false;
}

function saveSession() {

}

function exportBackup() {
    const payload = { exportedAt: new Date().toISOString(), data: persistableState() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateTag = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `RSS_Exam_Portal_Backup_${dateTag}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Backup file downloaded successfully!', 'success');
}

function triggerRestore() {
    document.getElementById('restore-file-input').click();
}

function handleRestoreFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const parsed = JSON.parse(e.target.result);
            const data = parsed.data || parsed;
            if (!data || typeof data !== 'object') throw new Error('Invalid file');
            if (!confirm('Restoring will overwrite all current data (students, teachers, marks, settings) with the backup file. Continue?')) return;
            Object.keys(data).forEach(key => { state[key] = data[key]; });
            saveState(true);
            showToast('Backup restored successfully! Syncing with cloud...', 'success');
            setTimeout(() => location.reload(), 1200);
        } catch (err) {
            console.error(err);
            showToast('Invalid or corrupted backup file.', 'error');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

function resetAllData() {
    if (!confirm('This will permanently erase ALL local data (students, teachers, marks, settings) from this browser cache. Continue?')) return;
    if (!confirm('Are you absolutely sure? Consider downloading a backup first.')) return;
    localStorage.removeItem(STORAGE_KEY);
    sessionStorage.removeItem(SESSION_KEY);
    showToast('Local browser data cleared. Reloading...', 'info');
    setTimeout(() => location.reload(), 1000);
}

const numToWords = (n) => {
    if (n === 0) return 'Zero';
    let num = n.toString();
    if (num.match(/^[0-9]+$/) === null) return 'Not a number';
    num = num.replace(/^0+/, '');
    if (num === '') return 'Zero';
    const a = ['', 'One ', 'Two ', 'Three ', 'Four ', 'Five ', 'Six ', 'Seven ', 'Eight ', 'Nine ', 'Ten ', 'Eleven ', 'Twelve ', 'Thirteen ', 'Fourteen ', 'Fifteen ', 'Sixteen ', 'Seventeen ', 'Eighteen ', 'Nineteen '];
    const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
    const formatTens = (numStr) => {
        let n = parseInt(numStr);
        if (n < 20) return a[n];
        return b[numStr[0]] + (numStr[1] === '0' ? ' ' : ' ' + a[numStr[1]]);
    };
    const formatHundreds = (numStr) => {
        let n = parseInt(numStr);
        if (n === 0) return '';
        if (n < 100) return formatTens(n.toString().padStart(2, '0'));
        let res = a[numStr[0]] + 'Hundred ';
        let remainder = parseInt(numStr.substr(1));
        if (remainder > 0) {
            res += 'and ' + formatTens(remainder.toString().padStart(2, '0'));
        }
        return res;
    };
    let words = '';
    if (num.length > 9) return 'Number too large'; 
    let crore = 0, lakh = 0, thousand = 0, hundred = 0;
    if (num.length > 7) {
        crore = parseInt(num.substr(0, num.length - 7));
        num = num.substr(num.length - 7);
    }
    if (num.length > 5) {
        lakh = parseInt(num.substr(0, num.length - 5));
        num = num.substr(num.length - 5);
    }
    if (num.length > 3) {
        thousand = parseInt(num.substr(0, num.length - 3));
        num = num.substr(num.length - 3);
    }
    hundred = parseInt(num);
    if (crore > 0) words += formatTens(crore.toString().padStart(2, '0')) + 'Crore ';
    if (lakh > 0) words += formatTens(lakh.toString().padStart(2, '0')) + 'Lakh ';
    if (thousand > 0) words += formatTens(thousand.toString().padStart(2, '0')) + 'Thousand ';
    if (hundred > 0) words += formatHundreds(hundred.toString().padStart(3, '0'));
    return words.trim();
};

function navigate(pageId) {
    currentPageId = pageId;

    document.querySelectorAll('#nav-menu a').forEach(el => {

            el.classList.remove('bg-blue-800', 'border-white', 'text-white');
            el.classList.add('text-blue-100', 'border-transparent');

function handleExcelUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet);

            if(jsonData.length === 0) {
                showToast("The uploaded file is empty", "error");
                return;
            }

            let added = 0;
            let newClassesAdded = 0;
            
            jsonData.forEach((row) => {
                const studentId = row['Student Id'] || row['Student ID'] || row['student id'];
                const fullName = row['FullName'] || row['Full Name'] || row['name'];
                const gender = row['Gender'] || row['gender'];
                const currentClass = row['CurrentClass'] || row['Current Class'] || row['Class'];
                const dob = row['DOB'] || row['dob'];

                if (studentId && fullName && currentClass) {
                    const rawClassStr = String(currentClass).trim();
                    const isNumeric = !isNaN(rawClassStr) && !isNaN(parseFloat(rawClassStr));
                    const finalClassName = isNumeric ? `Class ${rawClassStr}` : (rawClassStr.toLowerCase().startsWith('class') ? rawClassStr : rawClassStr);

                    if(!state.students.find(s => s.id === String(studentId))) {
                        state.students.push({
                            id: String(studentId),
                            name: fullName,
                            className: finalClassName,
                            gender: gender || '-',
                            dob: dob || '-'
                        });
                        added++;
                    }

                    if (!state.classes.includes(finalClassName)) {
                        state.classes.push(finalClassName);
                        newClassesAdded++;
                    }
                }
            });

            if (newClassesAdded > 0) {
                state.classes.sort((a, b) => {
                    const numA = parseInt(a.replace(/[^0-9]/g, '')) || 999;
                    const numB = parseInt(b.replace(/[^0-9]/g, '')) || 999;
                    if (numA !== numB) return numA - numB;
                    return a.localeCompare(b);
                });
            }

            showToast(`Successfully uploaded ${added} students! ${newClassesAdded > 0 ? '(' + newClassesAdded + ' classes auto-added)' : ''}`, "success");
            renderManageStudents(document.getElementById('content-area'));
        } catch(error) {
            console.error(error);
            showToast("Error parsing Excel file. Check format.", "error");
        }
    };
    reader.readAsArrayBuffer(file);
}

function handleAddStudent(e) {
    e.preventDefault();
    const id = document.getElementById('add-s-id').value.trim();
    const name = document.getElementById('add-s-name').value.trim();
    const gender = document.getElementById('add-s-gender').value;
    const className = document.getElementById('add-s-class').value;
    const dob = document.getElementById('add-s-dob').value.trim();

    if (state.students.find(s => s.id === id)) {
        showToast("A student with this ID already exists!", "error");
        return;
    }

    state.students.unshift({ id, name, gender, className, dob }); 
    showToast("Student added successfully", "success");
    
    document.getElementById('filter-class').value = className;
    document.getElementById('search-student').value = ''; 
    document.getElementById('add-student-form').reset();
    updateStudentTable();
}

function updateStudentTable() {
    const tbody = document.getElementById('student-table-body');
    const searchInput = document.getElementById('search-student');
    const classFilter = document.getElementById('filter-class');
    if(!tbody) return;

    const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
    const selectedClass = classFilter ? classFilter.value : 'ALL';

    const filteredStudents = state.students.filter(s => {
        const matchesSearch = s.name.toLowerCase().includes(searchTerm) || s.id.toLowerCase().includes(searchTerm);
        const matchesClass = selectedClass === 'ALL' || s.className === selectedClass;
        return matchesSearch && matchesClass;
    });

    tbody.innerHTML = '';
    
    if(filteredStudents.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-400">No students found matching criteria.</td></tr>';
    } else {
        filteredStudents.forEach(s => {
            const tr = document.createElement('tr');
            tr.className = 'bg-white border-b hover:bg-gray-50';
            
            if (confirmDeleteStudentId === s.id) {
                tr.innerHTML = `
                    <td colspan="6" class="px-4 py-3 bg-red-50 text-center border-red-200">
                        <div class="flex flex-col sm:flex-row items-center justify-center gap-2">
                            <span class="text-sm font-medium text-red-700"><i class="fas fa-exclamation-triangle mr-1"></i> Delete ${s.name}?</span>
                            <div class="flex gap-2">
                                <button onclick="executeDeleteStudent('${s.id}')" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-xs font-medium transition-colors">Yes, Delete</button>
                                <button onclick="cancelDeleteStudent()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-3 py-1.5 rounded text-xs font-medium transition-colors">Cancel</button>
                            </div>
                        </div>
                    </td>
                `;
            } else if (editingStudentId === s.id) {
                tr.innerHTML = `
                    <td class="px-2 py-2 min-w-[120px]"><input type="text" value="${s.id}" class="w-full px-2 py-1 border rounded text-sm bg-gray-100 text-gray-500 cursor-not-allowed" disabled></td>

                        </select>
                    </td>

                            ${state.classes.map(c => `<option value="${c}" ${s.className === c ? 'selected' : ''}>${c}</option>`).join('')}

                    </td>
                    <td class="px-2 py-2 min-w-[100px]"><input type="text" id="edit-s-dob" value="${s.dob !== '-' ? s.dob : ''}" class="w-full px-2 py-1 border rounded text-sm focus:ring-1 focus:ring-blue-500 outline-none"></td>
                    <td class="px-2 py-2 text-right sticky right-0 bg-gray-50 z-10 shadow-[-5px_0_10px_-5px_rgba(0,0,0,0.1)]">

                    </td>
                `;
            } else {
                tr.innerHTML = `
                    <td class="px-4 sm:px-6 py-3 font-medium text-gray-900">${s.id}</td>
                    <td class="px-4 sm:px-6 py-3 truncate max-w-[200px]" title="${s.name}">${s.name}</td>

                    </td>
                    <td class="px-4 sm:px-6 py-3">${s.dob || '-'}</td>
                    <td class="px-4 sm:px-6 py-3 text-right sticky right-0 bg-white group-hover:bg-gray-50 z-10 shadow-[-5px_0_10px_-5px_rgba(0,0,0,0.05)]">

    const gender = document.getElementById('edit-s-gender').value;
    const className = document.getElementById('edit-s-class').value;
    const dob = document.getElementById('edit-s-dob').value.trim();

    const student = state.students.find(s => s.id === id);

        student.name = name;
        student.gender = gender;
        student.className = className;
        student.dob = dob;
        showToast("Student details updated", "success");
    }
    editingStudentId = null;
    updateStudentTable();
}

function startDeleteStudent(id) { confirmDeleteStudentId = id; editingStudentId = null; updateStudentTable(); }

function generateTeacherCredentials(fullName, contactNum) {
    let cleanName = fullName.trim().toLowerCase();
    let firstName = cleanName.split(' ')[0] || 'tec';
    let prefix = firstName.replace(/[^a-z]/g, '').substr(0, 3);
    if(prefix.length < 3) prefix = prefix.padEnd(3, 'x');

    let cleanContact = String(contactNum || '').trim();
    let suffix = cleanContact.slice(-3);
    if(suffix.length < 3) suffix = '123';

    let username = prefix + suffix;
    let password = cleanContact || 'password123';
    return { username, password };
}

function handleTeacherExcelUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet);

            let added = 0;
            
            jsonData.forEach((row) => {
                const fullName = row['Full Name'] || row['FullName'] || row['name'] || row['Name'];
                const contact = row['Contact Number'] || row['Contact'] || row['contact number'] || row['Phone'];
                
                if (fullName) {
                    let creds = generateTeacherCredentials(fullName, contact);
                    let username = creds.username;
                    let password = creds.password;

                    let counter = 1;
                    let baseUser = username;
                    while(state.teachers.find(t => t.username === username)) {
                        username = baseUser + counter;
                        counter++;
                    }

                    state.teachers.push({
                        id: 'T' + Date.now() + Math.floor(Math.random() * 1000),
                        username: username,
                        password: password,
                        fullName: fullName,
                        contact: contact || '-',
                        assignments: []
                    });
                    added++;
                }
            });

            showToast(`Successfully uploaded ${added} teachers!`, "success");
            renderManageTeachers(document.getElementById('content-area'));
        } catch(error) {
            showToast("Error parsing Excel file.", "error");
        }
    };
    reader.readAsArrayBuffer(file);
}

function toggleNewTeacherFields() {
    const selectVal = document.getElementById('t-select').value;
    const fields = document.getElementById('new-teacher-fields');
    const nameIn = document.getElementById('t-fullname');

    const btn = document.getElementById('submit-teacher-btn');

    if(selectVal === 'NEW') {
        fields.classList.remove('hidden');
        if(nameIn) nameIn.setAttribute('required', 'true');
        if(contactIn) contactIn.setAttribute('required', 'true');
        btn.innerText = "Create & Assign";
    } else {
        fields.classList.add('hidden');

    }
}

function handleCreateTeacher(e) {
    e.preventDefault();
    const selectId = document.getElementById('t-select').value;
    const className = document.getElementById('t-class').value;
    const subject = document.getElementById('t-subject').value;
    const isClassTeacher = document.getElementById('t-class-teacher').checked;

    if (!subject && !isClassTeacher) {
        showToast("Please assign a Subject or select 'Assign as Class Teacher'", "error");
        return;
    }

    if (isClassTeacher) {
        const existingCT = state.teachers.find(t => (t.classTeacherOf || []).includes(className) && t.id !== selectId);
        if (existingCT) {
            showToast(`${className} already has a Class Teacher (${existingCT.fullName}). Remove them first to reassign.`, 'error');
            return;
        }
    }

    if (subject) {
        let alreadyAssignedTo = null;
        for (const t of state.teachers) {
            if (t.assignments.some(a => a.className === className && a.subject === subject) && t.id !== selectId) {
                alreadyAssignedTo = t.fullName || t.username;
                break;
            }
        }
        if (alreadyAssignedTo) {
            showToast(`Warning: ${className} - ${subject} is already assigned to ${alreadyAssignedTo}!`, 'error');
            return;
        }
    }

    if(selectId === 'NEW') {
        const fullName = document.getElementById('t-fullname').value.trim();
        const contact = document.getElementById('t-contact').value.trim();
        
        let creds = generateTeacherCredentials(fullName, contact);
        let username = creds.username;
        let password = creds.password;
        
        let existing = state.teachers.find(t => t.username === username);
        if(existing) username += Math.floor(Math.random() * 10);

        state.teachers.push({
            id: 'T' + Date.now(),
            username, password, fullName, contact: contact || '-', 
            assignments: subject ? [{className, subject}] : [],
            classTeacherOf: isClassTeacher ? [className] : []
        });
        showToast(`Created teacher ${fullName}`, 'success');
        renderManageTeachers(document.getElementById('content-area')); 
        
    } else {
        let teacher = state.teachers.find(t => t.id === selectId);
        if(teacher) {
            if (!teacher.classTeacherOf) teacher.classTeacherOf = [];
            let actions = [];
            
            if (subject) {
                const exists = teacher.assignments.find(a => a.className === className && a.subject === subject);
                if(!exists) {
                    teacher.assignments.push({className, subject});
                    actions.push(`Subject (${subject})`);
                }
            }
            if (isClassTeacher && !teacher.classTeacherOf.includes(className)) {
                teacher.classTeacherOf.push(className);
                actions.push(`Class Teacher`);
            }
            
            if(actions.length > 0) {
                showToast(`Assigned ${actions.join(' & ')} to ${teacher.fullName}`, 'success');
            } else {
                showToast('Teacher already has this exact assignment', 'info');
            }
        }
        updateTeacherList();
        document.getElementById('t-class').value = '';
        document.getElementById('t-subject').value = '';
        document.getElementById('t-class-teacher').checked = false;
    }
}

function startEditTeacher(id) { editingTeacherId = id; confirmDeleteTeacherId = null; updateTeacherList(); }
function cancelEditTeacher() { editingTeacherId = null; updateTeacherList(); }
function saveEditTeacher(id) {
    const user = document.getElementById(`edit-t-user-${id}`).value.trim();
    const pass = document.getElementById(`edit-t-pass-${id}`).value.trim();
    const name = document.getElementById(`edit-t-name-${id}`).value.trim();
    if(!user || !pass) { showToast("Required", "error"); return; }
    
    const teacher = state.teachers.find(t => t.id === id);
    if(teacher) {
        teacher.username = user; teacher.password = pass; teacher.fullName = name;
        editingTeacherId = null;
        updateTeacherList();
        showToast("Updated", "success");
    }
}
function startDeleteTeacher(id) { confirmDeleteTeacherId = id; editingTeacherId = null; updateTeacherList(); }
function cancelDeleteTeacher() { confirmDeleteTeacherId = null; updateTeacherList(); }
function executeDeleteTeacher(id) {
    state.teachers = state.teachers.filter(t => t.id !== id);
    confirmDeleteTeacherId = null;
    updateTeacherList();
    showToast("Deleted", "info");
}
function removeAssignment(tId, aIdx) {
    const t = state.teachers.find(x => x.id === tId);
    if(t) { t.assignments.splice(aIdx, 1); updateTeacherList(); }
}

function removeClassTeacher(tId, className) {
    const t = state.teachers.find(x => x.id === tId);
    if(t && t.classTeacherOf) {
        t.classTeacherOf = t.classTeacherOf.filter(c => c !== className);
        updateTeacherList();
        showToast("Removed from Class Teacher role", "info");
    }
}

function handleTeacherPasswordChange(e) {
    e.preventDefault();
    const curr = document.getElementById('current-pass').value;
    const neu = document.getElementById('new-pass').value;
    const conf = document.getElementById('confirm-pass').value;

    if (curr !== state.currentUser.password) {
        showToast("Current password is incorrect", "error");
        return;
    }
    if (neu !== conf) {
        showToast("New passwords do not match", "error");
        return;
    }

    state.currentUser.password = neu;
    
    if (state.currentUser.role === 'teacher') {
        const teacherRecord = state.teachers.find(t => t.id === state.currentUser.id);
        if (teacherRecord) teacherRecord.password = neu;
    }

    showToast("Password successfully updated!", "success");
    document.getElementById('current-pass').value = '';
    document.getElementById('new-pass').value = '';
    document.getElementById('confirm-pass').value = '';
}

function handleAddClass() {
    const val = document.getElementById('new-class-input').value.trim();
    if(!val) return;
    if(state.classes.includes(val)) { showToast("Exists", "error"); return; }
    state.classes.push(val); document.getElementById('new-class-input').value = '';
    updateAcademicLists(); showToast("Added", "success");
}
function startEditClass(i) { editingClassIndex = i; confirmDeleteClassIndex = -1; updateAcademicLists(); }
function cancelEditClass() { editingClassIndex = -1; updateAcademicLists(); }
function saveEditClass(i, old) {
    const val = document.getElementById(`edit-class-input-${i}`).value.trim();
    if(val && val !== old && !state.classes.includes(val)) {
        state.classes[i] = val;
        state.students.forEach(s => { if(s.className===old) s.className=val; });
        state.teachers.forEach(t => {
            t.assignments.forEach(a => { if(a.className===old) a.className=val; });
            if(t.classTeacherOf) {
                const idx = t.classTeacherOf.indexOf(old);
                if(idx > -1) t.classTeacherOf[idx] = val;
            }
        });
    }
    cancelEditClass();
}
function startDeleteClass(i) { confirmDeleteClassIndex = i; editingClassIndex = -1; updateAcademicLists(); }
function cancelDeleteClass() { confirmDeleteClassIndex = -1; updateAcademicLists(); }
function executeDeleteClass(i) { 
    const deletedClass = state.classes[i];
    state.classes.splice(i, 1); 
    state.teachers.forEach(t => { 
        t.assignments = t.assignments.filter(a => a.className !== deletedClass); 
        if(t.classTeacherOf) t.classTeacherOf = t.classTeacherOf.filter(c => c !== deletedClass);
    });
    cancelDeleteClass(); 
}

function handleAddSubject() {
    const val = document.getElementById('new-subject-input').value.trim();
    if(val && !state.subjects.includes(val)) {
        state.subjects.push(val); document.getElementById('new-subject-input').value = '';
        updateAcademicLists();
    }
}
function startEditSubject(i) { editingSubjectIndex = i; confirmDeleteSubjectIndex = -1; updateAcademicLists(); }
function cancelEditSubject() { editingSubjectIndex = -1; updateAcademicLists(); }
function saveEditSubject(i, old) {
    const val = document.getElementById(`edit-subject-input-${i}`).value.trim();
    if(val && val !== old && !state.subjects.includes(val)) { state.subjects[i] = val; }
    cancelEditSubject();
}
function startDeleteSubject(i) { confirmDeleteSubjectIndex = i; editingSubjectIndex = -1; updateAcademicLists(); }
function cancelDeleteSubject() { confirmDeleteSubjectIndex = -1; updateAcademicLists(); }
function executeDeleteSubject(i) { state.subjects.splice(i, 1); cancelDeleteSubject(); }

function switchSubMgtTab(level) {
    document.querySelectorAll('.sub-mgt-tab').forEach(el => {
        el.classList.remove('text-blue-600', 'border-blue-600', 'font-semibold');
        el.classList.add('text-gray-500', 'border-transparent', 'font-medium');
    });

function loadExamSubjectsHigher() {
    const cls = document.getElementById('exam-sub-class-higher').value;
    const container = document.getElementById('exam-sub-container-higher');
    if(!cls) return;

    const students = state.students.filter(s => s.className === cls);
    if(students.length===0) { container.innerHTML = 'No students found.'; return; }

    let checkedCompulsory = (state.examSettings.compulsorySubjects && state.examSettings.compulsorySubjects[cls]) || [];
    
    let bulkHtml = `
        <div class="mb-4 p-3 border rounded-lg bg-gray-50 shrink-0">
            <h4 class="font-bold text-sm mb-2 text-gray-700">Bulk Assign Compulsory</h4>
            <div class="flex flex-wrap gap-2 mb-3">
                ${state.subjects.map(s => `
                    <label class="inline-flex items-center bg-white px-2 py-1 rounded border text-xs cursor-pointer shadow-sm">
                        <input type="checkbox" class="bulk-sub-cb form-checkbox h-3 w-3 text-blue-600 rounded mr-1" value="${s}" ${checkedCompulsory.includes(s)?'checked':''}>${s}
                    </label>`).join('')}
            </div>
            <button onclick="bulkAssignSubjects('${cls}')" class="bg-blue-800 text-white px-3 py-1.5 rounded text-xs">Apply to All</button>
        </div>
    `;

    let listHtml = students.map(s => {
        const assigned = (state.examSettings.studentSubjects && state.examSettings.studentSubjects[s.id]) || [];
        return `
        <div class="border rounded-lg p-3 bg-white mb-2 student-row shadow-sm" data-student-id="${s.id}">
            <div class="flex flex-col sm:flex-row justify-between sm:items-center border-b pb-2 mb-2 gap-2">
                <span class="text-sm font-bold text-gray-800">${s.name} <span class="text-xs text-gray-500 font-normal">(${s.id})</span></span>
                <button onclick="saveStudentSubjects('${s.id}')" class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded w-full sm:w-auto">Save</button>
            </div>
            <div class="flex flex-wrap gap-2">
                ${state.subjects.map(sub => `
                    <label class="inline-flex items-center text-xs bg-gray-50 border rounded px-1.5 py-0.5">
                        <input type="checkbox" class="h-3 w-3 mr-1 student-sub-cb-${s.id}" value="${sub}" ${assigned.includes(sub)?'checked':''}>${sub}
                    </label>
                `).join('')}
            </div>
        </div>`;
    }).join('');

    container.innerHTML = `
        ${bulkHtml}
        <div class="flex-1 overflow-y-auto custom-scrollbar pr-1">
            ${listHtml}
        </div>
        <div class="mt-3 shrink-0">
             <button onclick="saveAllStudentSubjects('${cls}')" class="w-full bg-green-600 text-white px-4 py-2 rounded text-sm font-bold">Save All Students</button>
        </div>

function bulkAssignSubjects(cls) {
    const selected = Array.from(document.querySelectorAll('.bulk-sub-cb:checked')).map(cb => cb.value);
    if (!state.examSettings.compulsorySubjects) state.examSettings.compulsorySubjects = {};
    state.examSettings.compulsorySubjects[cls] = selected;
    
    if (!state.examSettings.studentSubjects) state.examSettings.studentSubjects = {};
    state.students.filter(s => s.className === cls).forEach(s => {
        const row = document.querySelector(`.student-row[data-student-id="${s.id}"]`);
        if(row) {
            row.querySelectorAll(`input[type="checkbox"]`).forEach(cb => { if(selected.includes(cb.value)) cb.checked = true; });
        }
        const existing = state.examSettings.studentSubjects[s.id] || [];
        state.examSettings.studentSubjects[s.id] = Array.from(new Set([...existing, ...selected]));
    });
    showToast("Bulk applied");
}

function saveStudentSubjects(id) {
    if(!state.examSettings.studentSubjects) state.examSettings.studentSubjects = {};
    state.examSettings.studentSubjects[id] = Array.from(document.querySelectorAll(`.student-sub-cb-${id}:checked`)).map(cb=>cb.value);
    showToast("Saved");
}

function saveAllStudentSubjects(cls) {
    state.students.filter(s => s.className === cls).forEach(s => saveStudentSubjects(s.id));
}

function getSubjectsForClass(cls) {
    if(isClassHigher(cls)) {
        let all = new Set();
        state.students.filter(s=>s.className===cls).forEach(s => {
            ((state.examSettings.studentSubjects||{})[s.id]||[]).forEach(sub=>all.add(sub));
        });
        return Array.from(all);
    }
    return (state.examSettings.classSubjects||{})[cls] || [];
}

function renderCreditHourMgmt(container) {
    const levels = ['Class 1-3', 'Class 4-5', 'Class 6-8', 'Class 9-10', 'Class 11-12'];
    let options = levels.map(l => `<option value="${l}">${l}</option>`).join('');
    
    container.innerHTML = `
        <div class="fade-in max-w-4xl mx-auto flex flex-col h-full">
            <div class="mb-4 sm:mb-6 no-print shrink-0 w-full">
                <select id="credit-hour-level" class="w-full sm:w-auto px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm" onchange="loadCreditHours()">
                    <option value="">Select Class Level Group</option>
                    ${options}
                </select>
            </div>
            <div id="credit-hour-container" class="flex-1 min-h-0 relative flex flex-col">
                <p class="text-gray-500 text-center py-8">Select a level to configure credit hours.</p>
            </div>
        </div>
    `;
}

function loadCreditHours() {
    const level = document.getElementById('credit-hour-level').value;
    const container = document.getElementById('credit-hour-container');
    if(!level) { container.innerHTML = '<p class="text-gray-500 text-center py-8">Select a level to configure credit hours.</p>'; return; }

    const levelMap = {
        'Class 1-3': [1, 2, 3],
        'Class 4-5': [4, 5],
        'Class 6-8': [6, 7, 8],
        'Class 9-10': [9, 10],
        'Class 11-12': [11, 12]
    };
    
    const targetNums = levelMap[level];
    let levelClasses = state.classes.filter(c => {
        const m = c.match(/\d+/);
        return m && targetNums.includes(parseInt(m[0]));
    });

    let allSubjectsSet = new Set();
    levelClasses.forEach(c => {
        let subs = getSubjectsForClass(c);
        subs.forEach(s => allSubjectsSet.add(s));
    });
    
    let subjects = Array.from(allSubjectsSet);
    
    if(subjects.length === 0) {
        container.innerHTML = `<div class="bg-yellow-50 border border-yellow-200 text-yellow-700 px-4 py-3 rounded-lg text-sm"><i class="fas fa-info-circle mr-2"></i> No subjects are currently assigned to any classes in ${level}. Please assign subjects in the Basic or Secondary Level tabs first.</div>`;
        return;
    }

    if(!state.examSettings.creditHours) state.examSettings.creditHours = {};
    let existingData = state.examSettings.creditHours[level] || {};

    let trs = subjects.map(s => {
        let val = existingData[s] !== undefined ? existingData[s] : '';
        return `
        <tr class="border-b hover:bg-gray-50">
            <td class="px-4 py-3 font-medium text-gray-700 text-sm">${s}</td>
            <td class="px-4 py-3 w-40 text-center">
                <input type="number" step="0.5" min="0" class="credit-input w-24 px-2 py-1.5 border border-gray-300 rounded text-center text-sm focus:ring-2 focus:ring-blue-500 outline-none" data-subject="${s.replace(/"/g, '&quot;')}" value="${val}" placeholder="e.g. 4">
            </td>
        </tr>
        `;
    }).join('');

    container.innerHTML = `
        <div class="bg-blue-50 text-blue-800 p-3 rounded-lg border border-blue-200 text-sm mb-4 shadow-sm">
            <i class="fas fa-clock mr-1"></i> Enter the Credit Hours (e.g., 4, 3, 1.5) for the subjects taught in ${level}.
        </div>
        <div class="bg-white border rounded-lg shadow-sm overflow-hidden mb-4 h-auto max-h-full flex flex-col">
            <div class="overflow-y-auto flex-1 custom-scrollbar">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 text-gray-700 text-xs uppercase sticky top-0">
                        <tr>
                            <th class="px-4 py-3">Subject Name</th>
                            <th class="px-4 py-3 text-center">Credit Hour</th>
                        </tr>
                    </thead>
                    <tbody>${trs}</tbody>
                </table>
            </div>
        </div>
        <div class="flex justify-end mt-4 shrink-0">
            <button onclick="saveCreditHours('${level}')" class="w-full sm:w-auto bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-lg text-sm font-bold shadow-sm flex items-center gap-2 justify-center transition-colors">
                <i class="fas fa-save"></i> Save Credit Hours
            </button>
        </div>
    `;
}

function saveCreditHours(level) {
    if(!state.examSettings.creditHours) state.examSettings.creditHours = {};
    state.examSettings.creditHours[level] = {};
    
    let savedCount = 0;
    document.querySelectorAll('.credit-input').forEach(inp => {
        const sub = inp.getAttribute('data-subject');
        const val = parseFloat(inp.value);
        if(!isNaN(val)) {
            state.examSettings.creditHours[level][sub] = val;
            savedCount++;
        }
    });
    showToast(`Credit hours successfully saved for ${savedCount} subjects in ${level}`, 'success');
}

function renderExamProcess(container) {
    container.innerHTML = `
        <div class="fade-in flex flex-col h-full gap-4">

function switchExamProcessTab(tabId) {
    document.querySelectorAll('.exam-process-tab').forEach(el => {
        el.classList.remove('text-blue-600', 'border-blue-600', 'font-semibold');
        el.classList.add('text-gray-500', 'border-transparent', 'font-medium');
    });
    const activeTab = document.getElementById(`sub-tab-${tabId}`);
    if(activeTab) {
        activeTab.classList.remove('text-gray-500', 'border-transparent', 'font-medium');
        activeTab.classList.add('text-blue-600', 'border-blue-600', 'font-semibold');
    }
    
    const container = document.getElementById('exam-process-content');
    container.innerHTML = '<div class="text-center py-10"><i class="fas fa-spinner fa-spin text-blue-500 text-3xl"></i></div>';

    setTimeout(() => {
        if(tabId === 'routine') renderExamRoutine(container);
        else if(tabId === 'term-mark-mgmt') renderTermMarkMgmt(container);
        else if(tabId === 'symbol-no') renderSymbolNo(container);
        else if(tabId === 'admit-card') renderAdmitCard(container);
        else if(tabId === 'mark-slip') renderMarkSlip(container);
    }, 50);
}

// Exam Routine Matrix
function renderExamRoutine(container) {
    if (!state.examSettings) state.examSettings = {};
    if (!state.examSettings.routines || typeof state.examSettings.routines !== 'object') state.examSettings.routines = {};
    if (!Array.isArray(state.examSettings.routineDates) || state.examSettings.routineDates.length === 0) {
        state.examSettings.routineDates = [''];
    }

    const dates = state.examSettings.routineDates;
    const classes = Array.isArray(state.classes) ? state.classes : [];

    if (dates.length === 1 && !dates[0]) {
        const discovered = [];
        Object.values(state.examSettings.routines || {}).forEach(rows => {
            (Array.isArray(rows) ? rows : []).forEach(r => {
                if (r && r.date && !discovered.includes(r.date)) discovered.push(r.date);
            });
        });
        if (discovered.length) {
            state.examSettings.routineDates = discovered;
        }
    }

    const activeDates = state.examSettings.routineDates;
    const escapeHtml = (value) => String(value ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    const normalizeDate = (value) => {
        const v = String(value || '');
        return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
    };

    const rows = classes.map((cls, classIndex) => {
        const routine = (state.examSettings.routines && state.examSettings.routines[cls]) || [];
        const cells = activeDates.map((date, dateIndex) => {
            const saved = routine.find(r => r && r.date === date);
            const selected = saved ? saved.subject : '';
            const subjects = getSubjectsForClass(cls);
            const options = ['<option value="">— Select Subject —</option>']
                .concat(subjects.map(sub => `<option value="${escapeHtml(sub)}" ${sub === selected ? 'selected' : ''}>${escapeHtml(sub)}</option>`))
                .join('');
            return `

        return `

                <th class="border border-gray-200 bg-gray-50 px-3 py-3 text-left font-semibold text-gray-700 whitespace-nowrap sticky left-0 z-10">${escapeHtml(cls)}</th>

    const headerDates = activeDates.map((date, i) => `

                    <i class="fas fa-times"></i>
                </button>
            </div>
        </th>`).join('');

    container.innerHTML = `

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4 no-print">

function addRoutineDate() {
    if (!state.examSettings) state.examSettings = {};
    if (!Array.isArray(state.examSettings.routineDates)) state.examSettings.routineDates = [];
    state.examSettings.routineDates.push('');
    renderExamRoutine(document.getElementById('exam-process-content'));
}

function removeRoutineDate(index) {
    if (!state.examSettings || !Array.isArray(state.examSettings.routineDates)) return;
    if (state.examSettings.routineDates.length <= 1) {
        state.examSettings.routineDates = [''];
    } else {
        state.examSettings.routineDates.splice(index, 1);
    }
    renderExamRoutine(document.getElementById('exam-process-content'));
}

function saveExamRoutineMatrix() {
    const dateInputs = Array.from(document.querySelectorAll('.routine-date'));
    const dates = dateInputs.map(input => input.value.trim());

    if (dates.some(d => !d)) {
        showToast('Please enter/select a date in every date column.', 'error');
        return;
    }
    const duplicateDates = dates.filter((d, i) => dates.indexOf(d) !== i);
    if (duplicateDates.length) {
        showToast('Each routine date must be unique.', 'error');
        return;
    }

    const duplicateCheck = new Set();
    const newRoutines = {};
    const selects = Array.from(document.querySelectorAll('.routine-subject'));

    selects.forEach(select => {
        const cls = select.getAttribute('data-class');
        const dateIndex = Number(select.getAttribute('data-date-index'));
        const subject = select.value;
        if (!cls || !dates[dateIndex] || !subject) return;
        if (!newRoutines[cls]) newRoutines[cls] = [];
        const key = `${cls}__${dates[dateIndex]}`;
        if (!duplicateCheck.has(key)) {
            newRoutines[cls].push({ subject, date: dates[dateIndex] });
            duplicateCheck.add(key);
        }
    });

    state.examSettings.routineDates = dates;
    state.examSettings.routines = {};
    (state.classes || []).forEach(cls => {
        state.examSettings.routines[cls] = newRoutines[cls] || [];
    });
    saveState(true);
    showToast('Exam routine saved successfully.', 'success');
    renderExamRoutine(document.getElementById('exam-process-content'));
}

function generateSymbolNos() {
    const cls = document.getElementById('sym-class-select').value;
    if(!cls) { showToast('Please select a class first', 'error'); return; }
    
    const appendAlpha = document.getElementById('sym-append-alpha').checked;
    const checkboxes = document.querySelectorAll('.sym-student-cb');
    
    let startIndex = -1;
    let baseNumStr = "";
    
    for (let i = 0; i < checkboxes.length; i++) {
        if (checkboxes[i].checked) {
            const studentId = checkboxes[i].value;
            const inputEl = document.getElementById(`sym-input-${studentId}`);
            if (inputEl && inputEl.value.trim() !== "") {
                const val = inputEl.value.trim();
                const numericMatch = val.match(/^(\d+)/);
                if (numericMatch) {
                    baseNumStr = numericMatch[1];
                    startIndex = i;
                    break;
                }
            }
        }
    }

    if (startIndex === -1) {
        showToast('Please type a starting symbol number in the first checked student row.', 'error');
        return;
    }
    
    let count = 0;
    let currentNum = parseInt(baseNumStr, 10);
    const numLength = baseNumStr.length;
    
    checkboxes.forEach((cb, index) => {
        if (cb.checked) {
            if (index >= startIndex) {
                const studentId = cb.value;
                const inputEl = document.getElementById(`sym-input-${studentId}`);
                if (inputEl) {
                    let numStr = currentNum.toString().padStart(numLength, '0');
                    let newSym = numStr;
                    if (appendAlpha) {
                        let remainder = currentNum % 26;
                        if (remainder === 0) remainder = 26;
                        const alphabet = String.fromCharCode(64 + remainder); 
                        newSym += alphabet;
                    }
                    inputEl.value = newSym;
                    currentNum++;
                    count++;
                }
            }
        } else {
             const studentId = cb.value;
             const inputEl = document.getElementById(`sym-input-${studentId}`);
             if (inputEl && !inputEl.value) {
                 inputEl.value = '';
             }
        }
    });

    if (count > 0) {
        showToast(`Generated symbol numbers for ${count} students. Click 'Save' to apply.`, 'info');
    } else {
        showToast('No students selected for generation.', 'error');
    }
}

function saveSymbolNos(cls) {
    const clsStudents = state.students.filter(s => s.className === cls);
    let savedCount = 0;
    clsStudents.forEach(s => {
        const inputEl = document.getElementById(`sym-input-${s.id}`);
        if(inputEl) {
            const newVal = inputEl.value.trim();
            if(s.symbolNo !== newVal) {
                s.symbolNo = newVal;
                savedCount++;
            }
        }
    });
    showToast(`Successfully saved changes for ${savedCount} students.`, 'success');
}

function loadMarkSlip() {
    const cls = document.getElementById('slip-class').value;
    const term = document.getElementById('slip-term').value || 'Term';
    const sub = document.getElementById('slip-subject').value;
    const container = document.getElementById('mark-slip-container');

    if(!cls || !sub) { 
        container.innerHTML = '<div class="text-center py-12 text-gray-400"><i class="fas fa-clipboard-list text-4xl mb-3 opacity-50"></i><p>Please select Class and Subject.</p></div>'; 
        return; 
    }

    const clsStudents = state.students.filter(s => s.className === cls);
    if(clsStudents.length === 0) {
        container.innerHTML = '<p class="text-center py-8 text-gray-500">No students in this class.</p>';
        return;
    }

    const isHigherClass = isClassHigher(cls);

    const getDivisions = (subName) => {
        if (state.examSettings.markDivisions && state.examSettings.markDivisions[cls] && state.examSettings.markDivisions[cls][subName]) {
            return state.examSettings.markDivisions[cls][subName];
        }
        return [{ category: 'Theory', name: 'TH', fm: 100, pm: 35 }];
    };

    const divs = getDivisions(sub);

    let theadHtml = `
        <thead class="bg-gray-100 text-gray-700 text-xs uppercase sticky top-0 z-10">
            <tr>
                <th rowspan="2" class="px-3 py-3 border border-gray-400 text-center bg-gray-200 w-16 shadow-[0_1px_0_#9ca3af]">S.N.</th>
                <th rowspan="2" class="px-4 py-3 border border-gray-400 text-center bg-gray-200 w-32 shadow-[0_1px_0_#9ca3af]">Symbol No</th>
                <th rowspan="2" class="px-4 py-3 border border-gray-400 text-left min-w-[200px] bg-gray-200 shadow-[0_1px_0_#9ca3af]">Student Name</th>
                <th colspan="${divs.length}" class="px-2 py-2 border border-gray-400 text-center bg-gray-200 shadow-[0_1px_0_#9ca3af]" title="${sub}">${sub}</th>
                <th rowspan="2" class="px-2 py-3 border border-gray-400 text-center bg-gray-200 w-32 shadow-[0_1px_0_#9ca3af]">Remarks</th>
            </tr>
            <tr>
    `;
    
    divs.forEach(d => {
        theadHtml += `<th class="px-2 py-2 border border-gray-400 text-center text-[11px] bg-gray-100 shadow-[0_1px_0_#9ca3af]">${d.name} <br> <span class="text-gray-500 normal-case font-medium">(FM:${d.fm})</span></th>`;
    });
    theadHtml += `</tr></thead>`;

    let tbodyHtml = '';
    clsStudents.sort((a, b) => a.name.localeCompare(b.name)).forEach((student, index) => {
        let sRow = `<tr class="text-sm bg-white hover:bg-gray-50">
            <td class="px-3 py-3 border border-gray-400 text-center text-gray-700 font-medium">${index+1}</td>
            <td class="px-4 py-3 border border-gray-400 font-medium text-gray-700 text-center">${student.symbolNo || '-'}</td>
            <td class="px-4 py-3 border border-gray-400 font-semibold text-gray-900">${student.name}</td>
        `;

        let mySubs = isHigherClass ? ((state.examSettings.studentSubjects && state.examSettings.studentSubjects[student.id]) || []) : [sub];

        if (isHigherClass && !mySubs.includes(sub)) {
            divs.forEach(() => sRow += `<td class="px-2 py-3 border border-gray-400 text-center bg-gray-100 text-gray-400 text-xs">N/A</td>`);
            sRow += `<td class="px-2 py-3 border border-gray-400 text-center bg-gray-100"></td>`; 
        } else {
            divs.forEach(() => sRow += `<td class="px-2 py-3 border border-gray-400 text-center"></td>`);
            sRow += `<td class="px-2 py-3 border border-gray-400 text-center"></td>`; 
        }
        sRow += '</tr>';
        tbodyHtml += sRow;
    });

    const sName = state.examSettings.schoolName || 'Shree Rasuwa Secondary School';
    const sAddress = state.examSettings.schoolAddress || 'Gosaikunda RM-6, Dhunche, Rasuwa';
    const aYear = state.examSettings.academicYear || new Date().getFullYear() + 56;

    container.innerHTML = `
        <div class="px-4 pt-4 pb-2 text-center print-section">
            <h2 class="text-xl font-bold uppercase">${sName}</h2>
            <p class="text-sm font-semibold">${sAddress}</p>
            <h3 class="text-md font-semibold text-gray-700 underline mt-1">BLANK MARK ENTRY SLIP</h3>
            <p class="text-sm font-medium text-gray-500 mt-1 mb-2">Class: <span class="text-black font-bold">${cls}</span> | Term: <span class="text-black font-bold">${term}</span> | Subject: <span class="text-black font-bold">${sub}</span> | Year: <span class="text-black font-bold">${aYear}</span></p>
        </div>
        <table id="mark-slip-table" class="w-full text-left border-collapse border border-gray-800">
            ${theadHtml}
            <tbody>${tbodyHtml}</tbody>
        </table>
    `;
}

function exportMarkSlipExcel() {
    const table = document.getElementById('mark-slip-table');
    if(!table) { 
        showToast('Please generate a Mark Slip first before exporting.', 'error'); 
        return; 
    }
    
    const term = document.getElementById('slip-term').value || 'Term';
    const cls = document.getElementById('slip-class').value || 'Class';
    const sub = document.getElementById('slip-subject').value || 'Subject';
    
    const wb = XLSX.utils.table_to_book(table, {sheet: "Mark Slip"});

function loadTmmDivisionEditor() {
    const cls = document.getElementById('tmm-class')?.value;
    const sub = document.getElementById('tmm-subject')?.value;
    const body = document.getElementById('tmm-division-editor-body');
    if (!body) return;

                </tbody>
            </table>

        </div>`;

}

function tmmDivisionRowHtml(d, index) {
    const category = d.category === 'Internal' ? 'Internal' : 'Theory';
    return `<tr data-tmm-row>
        <td class="border px-2 py-1.5">
            <select class="tmm-div-category w-full px-2 py-1.5 border rounded bg-white">
                <option value="Theory" ${category === 'Theory' ? 'selected' : ''}>Theory</option>
                <option value="Internal" ${category === 'Internal' ? 'selected' : ''}>Internal</option>
            </select>
        </td>
        <td class="border px-2 py-1.5"><input class="tmm-div-name w-full px-2 py-1.5 border rounded" value="${String(d.name).replace(/"/g, '&quot;')}" placeholder="e.g. Theory / Practical"></td>
        <td class="border px-2 py-1.5"><input class="tmm-div-fm w-full px-2 py-1.5 border rounded text-center" type="number" min="0" step="0.01" value="${d.fm}" oninput="updateTmmDivisionTotal()"></td>
        <td class="border px-2 py-1.5"><input class="tmm-div-pm w-full px-2 py-1.5 border rounded text-center" type="number" min="0" step="0.01" value="${d.pm}"></td>
        <td class="border px-2 py-1.5 text-center"><button onclick="this.closest('tr').remove(); updateTmmDivisionTotal();" class="text-red-500 hover:text-red-700 px-2 py-1" title="Remove"><i class="fas fa-trash"></i></button></td>
    </tr>`;
}

function addTmmDivisionRow(category = 'Internal') {
    const tbody = document.getElementById('tmm-division-rows');
    if (!tbody) return;
    const idx = tbody.querySelectorAll('tr[data-tmm-row]').length;
    const name = category === 'Internal' ? `Internal ${idx + 1}` : `Theory ${idx + 1}`;
    tbody.insertAdjacentHTML('beforeend', tmmDivisionRowHtml({ category, name, fm: 0, pm: 0 }, idx));
    updateTmmDivisionTotal();
}

function updateTmmDivisionTotal() {
    const totalEl = document.getElementById('tmm-division-total');
    const fullEl = document.getElementById('tmm-full-mark');
    const tbody = document.getElementById('tmm-division-rows');
    if (!totalEl || !fullEl || !tbody) return;
    const full = Number(fullEl.value) || 0;
    let total = 0, theory = 0, internal = 0;
    tbody.querySelectorAll('tr[data-tmm-row]').forEach(row => {
        const fm = Number(row.querySelector('.tmm-div-fm')?.value) || 0;
        const cat = row.querySelector('.tmm-div-category')?.value;
        total += fm;
        if (cat === 'Internal') internal += fm; else theory += fm;
    });
    const diff = Math.round((total - full) * 100) / 100;
    const status = diff === 0 ? 'text-green-700 bg-green-50 border-green-200' : 'text-red-700 bg-red-50 border-red-200';
    totalEl.className = `w-full px-3 py-2 rounded-lg border text-sm font-semibold ${status}`;
    totalEl.innerHTML = `Theory: ${theory} &nbsp;|&nbsp; Internal: ${internal} &nbsp;|&nbsp; Total: ${total} / ${full} ${diff === 0 ? '<i class="fas fa-check-circle ml-1"></i>' : `<span class="ml-1">(Difference: ${diff > 0 ? '+' : ''}${diff})</span>`}`;
}

function collectTmmDivisions() {
    const full = Number(document.getElementById('tmm-full-mark')?.value) || 0;
    const rows = document.querySelectorAll('#tmm-division-rows tr[data-tmm-row]');
    const divs = [];
    rows.forEach(row => {
        const category = row.querySelector('.tmm-div-category')?.value === 'Internal' ? 'Internal' : 'Theory';
        const name = (row.querySelector('.tmm-div-name')?.value || '').trim() || (category === 'Internal' ? 'Internal' : 'Theory');
        const fm = Number(row.querySelector('.tmm-div-fm')?.value) || 0;
        const pm = Number(row.querySelector('.tmm-div-pm')?.value) || 0;
        divs.push({ category, name, fm, pm });
    });
    return { full, divs };
}

function saveTmmDivision(applyAll = false) {
    const cls = document.getElementById('tmm-class')?.value;
    const sub = document.getElementById('tmm-subject')?.value;
    if (!cls || !sub) { showToast('Please select Class and Subject first.', 'error'); return; }
    const { full, divs } = collectTmmDivisions();
    if (full <= 0 || divs.length === 0) { showToast('Please enter Full Mark and at least one division.', 'error'); return; }
    const total = divs.reduce((a, d) => a + d.fm, 0);
    if (Math.abs(total - full) > 0.001) {
        showToast(`Division total (${total}) must equal Full Mark (${full}).`, 'error');
        return;
    }
    if (divs.some(d => d.fm < 0 || d.pm < 0 || d.pm > d.fm)) {
        showToast('Each Pass Mark must be between 0 and its component Full Mark.', 'error');
        return;
    }
    if (!state.examSettings.markDivisions) state.examSettings.markDivisions = {};
    if (!state.examSettings.markDivisions[cls]) state.examSettings.markDivisions[cls] = {};

    if (applyAll) {
        const subjects = getSubjectsForClass(cls);
        if (!subjects.length) { showToast('No subjects configured for this class.', 'error'); return; }
        subjects.forEach(subject => {
            state.examSettings.markDivisions[cls][subject] = divs.map(d => ({ ...d }));
        });
        saveState();
        showToast(`Mark division applied to all ${subjects.length} subject(s) in ${cls}.`, 'success');
    } else {
        state.examSettings.markDivisions[cls][sub] = divs;
        saveState();
        showToast(`Mark division saved for ${cls} - ${sub}.`, 'success');
    }
    loadTmmDivisionEditor();
    const term = document.getElementById('tmm-term')?.value;
    if (term && cls && sub) renderMarkEntryGrid(document.getElementById('term-mark-grid-container'), cls, sub, term, true);
}

function loadAdminMarkEntry() {
    const term = document.getElementById('tmm-term').value;
    const cls = document.getElementById('tmm-class').value;

}

function handleMarkInputKeydown(event, input) {
    if (event.key !== 'Enter') return;
    event.preventDefault();

    const idx = input.getAttribute('data-idx');
    const inputs = Array.from(document.querySelectorAll('.mark-input'))
        .filter(el => el.getAttribute('data-idx') === idx);
    const currentIndex = inputs.indexOf(input);

    if (currentIndex >= 0 && currentIndex < inputs.length - 1) {
        const nextInput = inputs[currentIndex + 1];
        nextInput.focus();
        if (typeof nextInput.select === 'function') nextInput.select();
    }
}

function onMarkInputChange(input) {
    const fm = Number(input.getAttribute('data-fm'));
    const val = input.value;
    if (val !== '' && (Number(val) > fm || Number(val) < 0)) {
        input.classList.add('border-red-400', 'bg-red-50', 'text-red-600');
        input.title = `Value must be between 0 and ${fm}`;
    } else {
        input.classList.remove('border-red-400', 'bg-red-50', 'text-red-600');
        input.title = '';
    }

    const studentId = input.getAttribute('data-student');
    let total = 0;
    document.querySelectorAll(`.mark-input[data-student="${studentId}"]`).forEach(inp => {
        if (inp.value !== '') total += Number(inp.value);
    });
    const totalCell = document.getElementById(`me-total-${studentId}`);
    if (totalCell) totalCell.innerText = total;
}

function saveMarkEntryGrid() {
    if (!markEntryCtx) return;
    const { cls, sub, term, divs } = markEntryCtx;

    if (!term) { showToast('Please select a Term before saving.', 'error'); return; }

    let invalidCount = 0;
    document.querySelectorAll('.mark-input').forEach(inp => {
        const fm = Number(inp.getAttribute('data-fm'));
        if (inp.value !== '' && (Number(inp.value) > fm || Number(inp.value) < 0)) invalidCount++;
    });
    if (invalidCount > 0) {
        showToast(`${invalidCount} mark(s) are out of range. Please fix the highlighted fields before saving.`, 'error');
        return;
    }

    const studentIds = new Set();
    document.querySelectorAll('.mark-input').forEach(inp => studentIds.add(inp.getAttribute('data-student')));

    let savedCount = 0;
    studentIds.forEach(studentId => {
        let components = {};
        let hasAnyValue = false;
        divs.forEach(d => {
            const inp = document.querySelector(`.mark-input[data-student="${studentId}"][data-idx="${d.originalIndex}"]`);
            if (inp && inp.value !== '') {
                components[d.originalIndex] = Number(inp.value);
                hasAnyValue = true;
            }
        });

        if (!hasAnyValue) return;

        let markRecord = state.marks.find(m => m.studentId === studentId && m.term === term && m.subject === sub);
        if (markRecord) {
            markRecord.components = components;
        } else {
            state.marks.push({ studentId, term, subject: sub, className: cls, components });
        }
        savedCount++;
    });

    showToast(`Marks saved successfully for ${savedCount} student(s) in ${sub} (${term}).`, 'success');
}

function switchGradeTab(id) { saveGradeRulesToState(); activeGradeScaleId = id; renderGradeRules(document.getElementById('content-area')); }
function saveGradeRulesToState() {
    let active = state.gradeRules.find(s => s.id === activeGradeScaleId);
    if(!active) return;
    const nameEl = document.getElementById('scale-name-input');
    if(nameEl) active.name = nameEl.value;
    
    const cbs = document.querySelectorAll('.scale-class-cb:checked');
    active.classes = Array.from(cbs).map(cb => cb.value);
    
    let rules = [];
    document.querySelectorAll('.grade-rule-row').forEach(row => {
        rules.push({
            min: parseFloat(row.querySelector('.rule-min').value)||0,
            max: parseFloat(row.querySelector('.rule-max').value)||0,
            grade: row.querySelector('.rule-grade').value,
            gpa: parseFloat(row.querySelector('.rule-gpa').value)||0,
            color: row.querySelector('.rule-color').value
        });
    });
    active.rules = rules.sort((a,b) => b.max - a.max);
}
function saveGradeRules() { saveGradeRulesToState(); showToast('Saved', 'success'); }
function addGradeRule() { saveGradeRulesToState(); state.gradeRules.find(s=>s.id===activeGradeScaleId).rules.push({min:0,max:0,grade:'',gpa:0,color:'text-gray-800'}); renderGradeRules(document.getElementById('content-area')); }
function removeGradeRule(i) { saveGradeRulesToState(); state.gradeRules.find(s=>s.id===activeGradeScaleId).rules.splice(i,1); renderGradeRules(document.getElementById('content-area')); }
function addNewGradeScale() { saveGradeRulesToState(); const id='scale-'+Date.now(); state.gradeRules.push({id, name:'New Scale', classes:[], rules:[]}); activeGradeScaleId=id; renderGradeRules(document.getElementById('content-area')); }
function deleteCurrentGradeScale() { if(state.gradeRules.length>1) { state.gradeRules=state.gradeRules.filter(s=>s.id!==activeGradeScaleId); activeGradeScaleId=state.gradeRules[0].id; renderGradeRules(document.getElementById('content-area')); } }

function getGradeInfo(percentage, className) {
    let activeScale = state.gradeRules.find(s => s.classes.includes(className)) || state.gradeRules[0];
    if (activeScale) {
        for (let r of activeScale.rules) {
            if (percentage >= r.min && percentage <= r.max) return { grade: r.grade, gpa: r.gpa, textClass: r.color + ' font-bold', isNG: (r.grade === 'NG' || r.gpa === 0) };
        }
    }
    return { grade: 'NG', gpa: 0.0, textClass: 'text-red-600 font-bold', isNG: true };
}
window.getGradeInfo = getGradeInfo;

function handleImageUpload(event, key) {

            document.getElementById('preview-' + key).classList.remove('hidden');
            document.getElementById('placeholder-' + key).classList.add('hidden');
        }
        r.readAsDataURL(file);
    }
}
