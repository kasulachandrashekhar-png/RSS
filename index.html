    <script>
        (function() {
            var nativeStringify = JSON.stringify;
            function createSafeReplacer(customReplacer) {
                var seen = new WeakSet();
                return function(key, val) {
                    if (typeof val === 'object' && val !== null) {
                        if (seen.has(val)) return '[Circular]';
                        seen.add(val);
                    }
                    if (typeof customReplacer === 'function') return customReplacer.call(this, key, val);
                    return val;
                };
            }
            JSON.stringify = function(value, replacer, space) {
                try {
                    if (typeof replacer === 'function') return nativeStringify(value, createSafeReplacer(replacer), space);
                    else if (Array.isArray(replacer)) return nativeStringify(value, replacer, space);
                    return nativeStringify(value, createSafeReplacer(), space);
                } catch (err) {
                    if (err instanceof TypeError && String(err.message).toLowerCase().includes('circular')) {
                        try { return nativeStringify(value, createSafeReplacer(), space); } catch (fallbackErr) { return '"[Circular]"'; }
                    }
                    throw err;
                }
            };
        })();
    </script>

<script>
// ============================================================

window.showToast = function(message, type) {
    type = type || 'success';
    const container = document.getElementById('toast-container');
    if (!container) { alert(message); return; }
    const toast = document.createElement('div');
    const bgColors = { success: 'bg-green-500', error: 'bg-red-500', info: 'bg-blue-500', warning: 'bg-amber-500' };
    const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle', warning: 'fa-exclamation-triangle' };
    toast.className = (bgColors[type] || bgColors.success) + ' text-white px-4 py-3 rounded shadow-lg flex items-center gap-3 fade-in max-w-xs sm:max-w-sm ml-auto';
    toast.innerHTML = '<i class="fas ' + (icons[type] || icons.success) + ' text-lg shrink-0"></i><span class="text-sm font-medium">' + message + '</span>';
    container.appendChild(toast);
    setTimeout(function() { toast.style.opacity = '0'; toast.style.transition = 'all 0.3s'; setTimeout(function(){ toast.remove(); }, 300); }, 3000);
};

window.switchLoginTab = function(role) {

function formatDateBS(dateStr) {
    if (!dateStr) return '-';
    if (/^\d{4}-\d{2}-\d{2}$/.test(String(dateStr))) return String(dateStr);
    try { const d = new Date(dateStr); if (!isNaN(d.getTime())) { const y = d.getFullYear(); const m = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0'); return y + '-' + m + '-' + day; } } catch (e) {}
    return String(dateStr);
}

function migrateOldDataToSessions(saved) {
    if (saved.sessions && Object.keys(saved.sessions).length > 0) return saved;

    const hasOld = (saved.students && saved.students.length) || (saved.marks && saved.marks.length) || (saved.attendance && saved.attendance.length);
    const session = createEmptySession(year);
    if (hasOld) {
        session.students = saved.students || [];
        session.marks = saved.marks || [];
        session.attendance = saved.attendance || [];
        if (Array.isArray(saved.terms)) session.terms = saved.terms.map((t, i) => ({ id: 'term-migrated-' + i, name: typeof t === 'string' ? t : (t.name || 'Term'), locked: false, published: false, createdAt: new Date().toISOString() }));
    }
    saved.sessions = {}; saved.sessions[year] = session;
    saved.activeSession = year;
    return saved;
}

function syncPushToCloud(immediate, section) {
    if (section) markDirty(section); else if (dirtySections.size === 0) markDirty();
    if (!window.portalFirebase || !window.portalFirebase.db) return Promise.resolve(false);
    const doPush = async function() {
        if (isCloudPushing) { hasPendingPush = true; return; }
        if (dirtySections.size === 0) { updateSaveIndicator(); return; }
        isCloudPushing = true; hasPendingPush = false; updateSaveIndicator(false, 'syncing');
        const pushSet = new Set(dirtySections); dirtySections.clear();
        try {
            const fb = window.portalFirebase;
            const nowIso = new Date().toISOString();
            const author = state.currentUser ? (state.currentUser.username || 'Admin') : 'System';
            const tasks = [];
            if (pushSet.has('meta') || pushSet.has('students') || pushSet.has('marks') || pushSet.has('attendance')) {
                tasks.push(fb.setDoc(fb.doc(fb.db, 'school_portal', 'all_sessions'), { id: 'all_sessions', sessions: state.sessions || {}, activeSession: state.activeSession, updatedAt: nowIso, updatedBy: author }).catch(e => console.warn(e)));
            }
            if (pushSet.has('meta')) {
                tasks.push(fb.setDoc(fb.doc(fb.db, 'school_portal', 'meta'), { id: 'meta', adminPassword: state.adminPassword || 'admin', adminEmails: state.adminEmails || [], classes: state.classes || [], subjects: state.subjects || [], months: state.months || [], gradeRules: state.gradeRules || [], examSettings: state.examSettings || {}, activeSession: state.activeSession, updatedAt: nowIso, updatedBy: author }).catch(e => console.warn(e)));
            }
            if (pushSet.has('teachers')) {
                tasks.push(fb.setDoc(fb.doc(fb.db, 'school_portal', 'teachers'), { id: 'teachers', list: state.teachers || [], updatedAt: nowIso, updatedBy: author }).catch(e => console.warn(e)));
            }
            await Promise.all(tasks);
            lastCloudSyncTime = new Date(); cloudSyncStatus = 'synced'; updateSaveIndicator();
        } catch (e) { console.error('Cloud push error:', e); pushSet.forEach(s => dirtySections.add(s)); cloudSyncStatus = 'error'; updateSaveIndicator(true); }
        finally { isCloudPushing = false; if (hasPendingPush && cloudSyncStatus !== 'error') { hasPendingPush = false; setTimeout(() => syncPushToCloud(true), 50); } }
    };
    if (immediate) { clearTimeout(cloudSaveTimer); return doPush(); }
    clearTimeout(cloudSaveTimer);
    return new Promise(resolve => { cloudSaveTimer = setTimeout(async () => { await doPush(); resolve(); }, 50); });
}
async function pullLatestFromCloud(silent) {
    if (!window.portalFirebase || !window.portalFirebase.db) return false;
    const fb = window.portalFirebase;
    try {
        const fetchDoc = async function(ref) { try { if (fb.getDocFromServer) return await fb.getDocFromServer(ref); } catch (e) {} return await fb.getDoc(ref); };
        const [metaSnap, sessionsSnap, teachersSnap] = await Promise.all([
            fetchDoc(fb.doc(fb.db, 'school_portal', 'meta')),
            fetchDoc(fb.doc(fb.db, 'school_portal', 'all_sessions')),
            fetchDoc(fb.doc(fb.db, 'school_portal', 'teachers'))
        ]);
        if (metaSnap && metaSnap.exists()) {
            const d = metaSnap.data();
            if (d.classes && d.classes.length) state.classes = d.classes;
            if (d.subjects && d.subjects.length) state.subjects = d.subjects;
            if (d.months && d.months.length) state.months = d.months;
            if (d.gradeRules && d.gradeRules.length) state.gradeRules = d.gradeRules;
            if (d.examSettings) state.examSettings = d.examSettings;
            if (d.adminPassword) state.adminPassword = d.adminPassword;
            if (d.adminEmails && d.adminEmails.length) state.adminEmails = d.adminEmails;
        }
        if (sessionsSnap && sessionsSnap.exists()) {
            const d = sessionsSnap.data();
            if (d.sessions && Object.keys(d.sessions).length) { state.sessions = d.sessions; if (d.activeSession) state.activeSession = d.activeSession; }
        }
        if (teachersSnap && teachersSnap.exists()) { const d = teachersSnap.data(); if (d.list && d.list.length) state.teachers = d.list; }
        if (!state.activeSession && Object.keys(state.sessions).length) state.activeSession = Object.keys(state.sessions)[0];
        ensureSessionExists(state.activeSession || '2083');
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(persistableState())); } catch (e) {}
        dirtySections.clear(); lastCloudSyncTime = new Date(); cloudSyncStatus = 'synced'; updateSaveIndicator();
        if (typeof smartRefreshActivePage === 'function') smartRefreshActivePage();
        return true;
    } catch (e) { console.error('Pull error:', e); return false; }
}
window.pullLatestFromCloud = pullLatestFromCloud;
window.triggerManualSync = async function() {
    updateSaveIndicator(false, 'syncing');
    showToast('Fetching from Cloud...', 'info');

async function initPortalCloudSync() {
    if (isCloudSyncInitializing) return;
    if (!window.portalFirebase || !window.portalFirebase.db) return;
    isCloudSyncInitializing = true;
    const fb = window.portalFirebase;
    try {
        await pullLatestFromCloud(true);
        const attach = function(ref, name, applyFn) {
            const unsub = fb.onSnapshot(ref, { includeMetadataChanges: false }, function(snap) {
                if (snap.metadata && snap.metadata.hasPendingWrites) return;
                if (snap.exists()) {
                    applyFn(snap.data());
                    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(persistableState())); } catch (e) {}
                    dirtySections.delete(name); lastCloudSyncTime = new Date(); cloudSyncStatus = 'synced'; updateSaveIndicator();
                    if (typeof smartRefreshActivePage === 'function') smartRefreshActivePage(name);
                }
            }, function(err) { console.warn('Snapshot ' + name + ':', err); });
            cloudUnsubscribers.push(unsub);
        };
        attach(fb.doc(fb.db, 'school_portal', 'meta'), 'meta', function(d) {
            if (d.classes && d.classes.length) state.classes = d.classes;
            if (d.subjects && d.subjects.length) state.subjects = d.subjects;
            if (d.gradeRules && d.gradeRules.length) state.gradeRules = d.gradeRules;
            if (d.examSettings) state.examSettings = d.examSettings;
        });
        attach(fb.doc(fb.db, 'school_portal', 'all_sessions'), 'sessions', function(d) {
            if (d.sessions && Object.keys(d.sessions).length) { state.sessions = d.sessions; if (d.activeSession) state.activeSession = d.activeSession; ensureSessionExists(state.activeSession || '2083'); }
        });
        attach(fb.doc(fb.db, 'school_portal', 'teachers'), 'teachers', function(d) { if (d.list && d.list.length) state.teachers = d.list; });
    } catch (e) { console.error('Cloud init error:', e); cloudSyncStatus = 'error'; updateSaveIndicator(true); }
    finally { isCloudSyncInitializing = false; }
}
window.initPortalCloudSync = initPortalCloudSync;

window.signInWithGoogle = async function() {
    if (!window.portalFirebase || !window.portalFirebase.auth) { showToast('Connecting to Google...', 'info'); return; }
    const fb = window.portalFirebase;
    const provider = new fb.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try {
        const result = await fb.signInWithPopup(fb.auth, provider);
        const user = result.user;
        const userEmail = (user.email || '').trim().toLowerCase();
        let adminEmails = (state.adminEmails || ['kasulachandrashekhar@gmail.com']).map(e => e.trim().toLowerCase());
        if (!adminEmails.includes('kasulachandrashekhar@gmail.com')) adminEmails.push('kasulachandrashekhar@gmail.com');
        const isAdmin = adminEmails.includes(userEmail);
        if (isAdmin) {
            state.currentUser = { role: 'admin', username: user.displayName || 'Administrator', email: user.email };
            saveSession(); loadApp(); showToast('Welcome Admin!', 'success'); return;
        }
        const teacher = state.teachers.find(t => (t.email || '').toLowerCase() === userEmail || (t.username || '').toLowerCase() === userEmail);
        if (teacher) {
            state.currentUser = Object.assign({}, teacher, { role: 'teacher', email: user.email });
            saveSession(); loadApp(); showToast('Welcome ' + (teacher.fullName || teacher.username) + '!', 'success'); return;
        }
        await fb.signOut(fb.auth).catch(function(){});
        state.currentUser = null; saveSession();
        showToast('Access Denied: ' + user.email, 'error');
    } catch (e) {
        const code = e && e.code || '';
        if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') showToast('Sign-in cancelled.', 'info');
        else if (code === 'auth/popup-blocked') showToast('Popup blocked. Allow popups.', 'warning');
        else showToast(e.message || 'Google sign-in failed', 'error');
    }
};

window.handleLogin = async function(e) {
    if (e && e.preventDefault) e.preventDefault();
    const role = document.getElementById('login-role').value;
    const user = (document.getElementById('username').value || '').trim();
    const pass = (document.getElementById('password').value || '').trim();
    const submitBtn = document.querySelector('#login-form button[type="submit"]');
    const origHtml = submitBtn ? submitBtn.innerHTML : '';
    if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Logging in...</span>'; }
    try {
        if (role === 'admin') {
            if (user.toLowerCase() !== 'admin') { showToast('Invalid Admin Username (use "admin")', 'error'); return; }
            let targetPass = state.adminPassword || 'admin';
            if (window.portalFirebase && window.portalFirebase.db) {
                try {
                    const fb = window.portalFirebase;
                    const snap = await fb.getDoc(fb.doc(fb.db, 'school_portal', 'meta'));
                    if (snap.exists() && snap.data().adminPassword) { targetPass = snap.data().adminPassword; state.adminPassword = targetPass; }
                } catch (e) {}
            }
            if (pass === targetPass) {
                state.currentUser = { role: 'admin', username: 'Administrator' };
                saveSession(); loadApp(); showToast('Welcome, Administrator!', 'success');
            } else { showToast('Incorrect Password', 'error'); }
        } else {
            let teacher = state.teachers.find(t => (t.username || '').toLowerCase() === user.toLowerCase() && (t.password || '').trim() === pass);
            if (!teacher && window.portalFirebase && window.portalFirebase.db) {
                try {
                    const fb = window.portalFirebase;
                    const snap = await fb.getDoc(fb.doc(fb.db, 'school_portal', 'teachers'));
                    if (snap.exists() && snap.data().list) { state.teachers = snap.data().list; teacher = state.teachers.find(t => (t.username || '').toLowerCase() === user.toLowerCase() && (t.password || '').trim() === pass); }
                } catch (e) {}
            }
            if (teacher) {
                state.currentUser = Object.assign({}, teacher, { role: 'teacher' });
                saveSession(); loadApp(); showToast('Welcome ' + (teacher.fullName || teacher.username) + '!', 'success');
            } else { showToast('Invalid Teacher Credentials', 'error'); }
        }
    } finally {
        if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = origHtml; }
    }
};

function numToWords(n) {
    if (n === 0) return 'Zero';
    var num = String(n).replace(/^0+/, '');
    if (!num) return 'Zero';
    var a = ['', 'One ', 'Two ', 'Three ', 'Four ', 'Five ', 'Six ', 'Seven ', 'Eight ', 'Nine ', 'Ten ', 'Eleven ', 'Twelve ', 'Thirteen ', 'Fourteen ', 'Fifteen ', 'Sixteen ', 'Seventeen ', 'Eighteen ', 'Nineteen '];
    var b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
    function t(s) { var i = parseInt(s, 10); if (i < 20) return a[i]; return b[s[0]] + (s[1] === '0' ? ' ' : ' ' + a[s[1]]); }
    function h(s) { var i = parseInt(s, 10); if (i === 0) return ''; if (i < 100) return t(s.padStart(2, '0')); var r = a[s[0]] + 'Hundred '; var rem = parseInt(s.substr(1), 10); if (rem > 0) r += 'and ' + t(String(rem).padStart(2, '0')); return r; }
    var words = '', crore = 0, lakh = 0, thousand = 0, rest = 0;
    if (num.length > 7) { crore = parseInt(num.substr(0, num.length - 7), 10); num = num.substr(num.length - 7); }
    if (num.length > 5) { lakh = parseInt(num.substr(0, num.length - 5), 10); num = num.substr(num.length - 5); }
    if (num.length > 3) { thousand = parseInt(num.substr(0, num.length - 3), 10); num = num.substr(num.length - 3); }
    rest = parseInt(num, 10);
    if (crore > 0) words += t(String(crore).padStart(2, '0')) + 'Crore ';
    if (lakh > 0) words += t(String(lakh).padStart(2, '0')) + 'Lakh ';
    if (thousand > 0) words += t(String(thousand).padStart(2, '0')) + 'Thousand ';
    if (rest > 0) words += h(String(rest).padStart(3, '0'));
    return words.trim();
}

function handleExcelUpload(event) {
    if (state.currentUser.role !== 'admin' && !getCtPermissions().add) { showToast('🔒 Add permission छैन', 'error'); return; }
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var data = new Uint8Array(e.target.result);
            var wb = XLSX.read(data, { type: 'array' });
            var ws = wb.Sheets[wb.SheetNames[0]];
            var json = XLSX.utils.sheet_to_json(ws);
            if (!json.length) { showToast("File empty", "error"); return; }
            var session = getActiveSessionData();
            var sessionYear = state.activeSession || '2083';
            var editable = getEditableClasses();
            var added = 0, skipped = 0, newClasses = 0;
            json.forEach(function(row) {
                var id = (row['Student Id'] || row['StudentID'] || '').toString().trim();
                var name = (row['FullName'] || row['Full Name'] || row['Name'] || '').toString().trim();
                var cls = (row['CurrentClass'] || row['Current Class'] || row['Class'] || '').toString().trim();
                if (!id || !name || !cls) { skipped++; return; }
                var isNum = !isNaN(cls) && !isNaN(parseFloat(cls));
                var finalCls = isNum ? 'Class ' + cls : cls;
                if (state.currentUser.role === 'teacher' && editable.indexOf(finalCls) === -1) { skipped++; return; }
                if (session.students.find(s => s.id === id)) { skipped++; return; }
                session.students.push({ id: id, name: name, gender: (row['Gender'] || '').toString().trim(), fatherName: (row['Father Name'] || '').toString().trim(), motherName: (row['Mother Name'] || '').toString().trim(), className: finalCls, section: (row['Section'] || '').toString().trim(), year: (row['Year (BS)'] || row['Year'] || sessionYear).toString().trim(), address: (row['Permanent Address'] || row['Address'] || '').toString().trim(), dob: (row['DOB'] || '').toString().trim(), contact: (row['Guardian Contact Number'] || row['Contact'] || '').toString().trim() });
                added++;
                if (state.classes.indexOf(finalCls) === -1) { state.classes.push(finalCls); newClasses++; }
            });
            if (newClasses > 0) { state.classes.sort(function(a, b) { return (parseInt(a.replace(/[^0-9]/g, ''), 10) || 999) - (parseInt(b.replace(/[^0-9]/g, ''), 10) || 999); }); saveState(true, 'meta'); }
            saveState(true, 'students');
            showToast('Imported ' + added + ' students' + (skipped ? ' (' + skipped + ' skipped)' : ''), added > 0 ? 'success' : 'warning');
            renderManageStudents(document.getElementById('content-area'));
        } catch (err) { console.error(err); showToast("Parse error", "error"); }
    };
    reader.readAsArrayBuffer(file);
}
window.handleExcelUpload = handleExcelUpload;

async function handleAddStudent(e) {
    e.preventDefault();
    if (state.currentUser.role !== 'admin' && !getCtPermissions().add) { showToast('🔒 Student add गर्ने अनुमति छैन।', 'error'); return; }
    var session = getActiveSessionData();
    var sessionYear = state.activeSession || '2083';
    var id = document.getElementById('add-s-id').value.trim();
    var name = document.getElementById('add-s-name').value.trim();
    var gender = document.getElementById('add-s-gender').value;
    var cls = document.getElementById('add-s-class').value;
    var section = document.getElementById('add-s-section').value.trim();
    var year = document.getElementById('add-s-year').value.trim();
    var father = document.getElementById('add-s-father').value.trim();
    var mother = document.getElementById('add-s-mother').value.trim();
    var dob = document.getElementById('add-s-dob').value.trim();
    var addr = document.getElementById('add-s-address').value.trim();
    var contact = document.getElementById('add-s-contact').value.trim();
    if (!canEditStudentInClass(cls)) { showToast("Not allowed for this class", "error"); return; }
    if (session.students.find(s => s.id === id)) { showToast("Student ID exists!", "error"); return; }
    session.students.unshift({ id: id, name: name, gender: gender, className: cls, section: section, year: year || sessionYear, fatherName: father, motherName: mother, dob: dob, address: addr, contact: contact });
    await saveState(true, 'students');
    showToast("Student added!", "success");
    document.getElementById('add-student-form').reset();
    document.getElementById('add-s-year').value = sessionYear;
    updateStudentTable();
}

window.toggleSelectAllStudents = function(masterCb) {
    var session = getActiveSessionData();
    if (!session) return;
    var filterCls = document.getElementById('filter-class')?.value || 'ALL';
    var searchTerm = (document.getElementById('search-student')?.value || '').toLowerCase();
    var editable = getEditableClasses();
    var visible = session.students.filter(function(s) {
        var mS = (s.name || '').toLowerCase().indexOf(searchTerm) > -1 || (s.id || '').toLowerCase().indexOf(searchTerm) > -1;
        var mC = filterCls === 'ALL' ? editable.indexOf(s.className) > -1 : s.className === filterCls;

};

function handleAddTerm(e) {
    e.preventDefault();
    var session = getActiveSessionData();
    var name = document.getElementById('new-term-name').value.trim();
    if (!name) return;
    if (session.terms.find(t => t.name.toLowerCase() === name.toLowerCase())) { showToast("Term exists!", "error"); return; }
    session.terms.push({ id: 'term-' + Date.now(), name: name, locked: false, published: false, createdAt: new Date().toISOString() });
    saveState(true, 'terms'); showToast('Term added!', 'success'); renderTermManagement(document.getElementById('content-area'));
}
function quickAddThreeTerms() {
    var session = getActiveSessionData();
    var defs = ['First Terminal Examination', 'Second Terminal Examination', 'Third Terminal Examination'];
    var added = 0;
    defs.forEach(function(name, i) { if (!session.terms.find(t => t.name === name)) { session.terms.push({ id: 'term-' + Date.now() + '-' + i, name: name, locked: false, published: false, createdAt: new Date().toISOString() }); added++; } });
    saveState(true, 'terms'); showToast(added ? 'Added ' + added : 'All exist', added ? 'success' : 'info');
    renderTermManagement(document.getElementById('content-area'));
}

function generateTeacherCredentials(name, contact) { var c = (name || '').toLowerCase().split(' ')[0].replace(/[^a-z]/g, '').substr(0, 3); if (c.length < 3) c = c.padEnd(3, 'x'); var s = String(contact || '').slice(-3); if (s.length < 3) s = '123'; return { username: c + s, password: contact || 'password123' }; }
function downloadTeacherExcelTemplate() { var d = [{ "Full Name": "Ram Bahadur", "Gmail": "ram@gmail.com", "Contact Number": "9841234567" }]; var ws = XLSX.utils.json_to_sheet(d); var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Teachers"); XLSX.writeFile(wb, "Teachers_Template.xlsx"); showToast("Downloaded!", "info"); }
function handleTeacherExcelUpload(event) {
    var file = event.target.files[0]; if (!file) return;
    var r = new FileReader();
    r.onload = function(e) {
        try {
            var data = new Uint8Array(e.target.result);
            var wb = XLSX.read(data, { type: 'array' });
            var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            var added = 0, noEmail = 0, dup = 0;
            rows.forEach(function(row) {
                var name = (row['Full Name'] || row['FullName'] || '').toString().trim();
                var email = (row['Gmail'] || row['Email'] || '').toString().trim().toLowerCase();
                var contact = (row['Contact Number'] || row['Contact'] || '').toString().trim();
                if (!name) return;
                if (!email || email.indexOf('@') === -1) { noEmail++; return; }
                if (state.teachers.some(t => (t.email || '').toLowerCase() === email)) { dup++; return; }
                var cr = generateTeacherCredentials(name, contact);
                var u = cr.username, p = cr.password, i = 1;
                while (state.teachers.find(t => t.username === u)) { u = cr.username + i; i++; }
                state.teachers.push({ id: 'T' + Date.now() + Math.floor(Math.random() * 1000), username: u, password: p, fullName: name, email: email, contact: contact || '-', assignments: [], classTeacherOf: [], studentPermissions: { add: true, edit: true, delete: true } });
                added++;
            });
            if (added) saveState(true, 'teachers');
            showToast('Added ' + added + ' teachers' + (noEmail ? ' (' + noEmail + ' no gmail)' : '') + (dup ? ' (' + dup + ' dup)' : ''), added > 0 ? 'success' : 'warning');
            renderManageTeachers(document.getElementById('content-area'));
        } catch (err) { showToast("Error parsing", "error"); }
    };
    r.readAsArrayBuffer(file);
}

function renderMyClasses(container) {

    if (u.classTeacherOf && u.classTeacherOf.length) {
        var perms = u.studentPermissions || { add: true, edit: true, delete: true };
        ctCards = u.classTeacherOf.map(c => '<div class="bg-green-50 p-4 rounded-xl border border-green-200 flex flex-col gap-2"><div class="flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-green-200 text-green-700 flex items-center justify-center text-xl"><i class="fas fa-star"></i></div><div><h4 class="font-bold">Class Teacher</h4><p class="text-sm text-green-700 font-semibold">' + c + '</p></div></div><div class="flex flex-wrap gap-1 mt-1">' + (perms.add ? '<span class="bg-emerald-100 text-emerald-700 text-[10px] px-2 py-0.5 rounded font-bold">+ADD</span>' : '<span class="bg-gray-200 text-gray-500 text-[10px] px-2 py-0.5 rounded line-through">ADD</span>') + (perms.edit ? '<span class="bg-blue-100 text-blue-700 text-[10px] px-2 py-0.5 rounded font-bold">EDIT</span>' : '<span class="bg-gray-200 text-gray-500 text-[10px] px-2 py-0.5 rounded line-through">EDIT</span>') + (perms.delete ? '<span class="bg-red-100 text-red-700 text-[10px] px-2 py-0.5 rounded font-bold">DELETE</span>' : '<span class="bg-gray-200 text-gray-500 text-[10px] px-2 py-0.5 rounded line-through">DELETE</span>') + '</div></div>').join('');
    }
    container.innerHTML = '<div class="fade-in max-w-5xl mx-auto">' + (ctCards ? '<h3 class="text-lg font-semibold mb-4"><i class="fas fa-crown text-yellow-500 mr-2"></i>Class Teacher Roles</h3><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">' + ctCards + '</div>' : '') + '<h3 class="text-lg font-semibold mb-4"><i class="fas fa-chalkboard-teacher text-blue-500 mr-2"></i>Assigned Subjects</h3><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">' + cards + '</div></div>';
}
function renderProfileSettings(container) {
    container.innerHTML = '<div class="fade-in max-w-md mx-auto bg-white p-6 rounded-xl border shadow-sm"><h3 class="text-base font-bold mb-4 border-b pb-2"><i class="fas fa-key mr-2 text-blue-600"></i>Change Password</h3><form onsubmit="handleTeacherPasswordChange(event)"><div class="mb-4"><label class="block text-sm font-medium mb-1">Current Password</label><input type="password" id="current-pass" class="w-full px-3 py-2 border rounded-lg text-sm" required></div><div class="mb-4"><label class="block text-sm font-medium mb-1">New Password</label><input type="password" id="new-pass" class="w-full px-3 py-2 border rounded-lg text-sm" required></div><div class="mb-6"><label class="block text-sm font-medium mb-1">Confirm</label><input type="password" id="confirm-pass" class="w-full px-3 py-2 border rounded-lg text-sm" required></div><button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg text-sm"><i class="fas fa-save mr-1"></i>Update Password</button></form></div>';
}
function handleTeacherPasswordChange(e) {
    e.preventDefault();
    var c = document.getElementById('current-pass').value;
    var n = document.getElementById('new-pass').value;
    var cf = document.getElementById('confirm-pass').value;
    if (c !== state.currentUser.password) { showToast("Current wrong", "error"); return; }
    if (n !== cf) { showToast("Mismatch", "error"); return; }
    state.currentUser.password = n;
    if (state.currentUser.role === 'teacher') { var tr = state.teachers.find(t => t.id === state.currentUser.id); if (tr) tr.password = n; }
    saveState(true, 'teachers');
    showToast("Updated!", "success");
    document.getElementById('current-pass').value = '';
    document.getElementById('new-pass').value = '';
    document.getElementById('confirm-pass').value = '';
}
window.renderMyClasses = renderMyClasses;
window.renderProfileSettings = renderProfileSettings;
window.handleTeacherPasswordChange = handleTeacherPasswordChange;

var editingClassIndex = -1, confirmDeleteClassIndex = -1;
var editingSubjectIndex = -1, confirmDeleteSubjectIndex = -1;
function renderManageAcademic(container) {
    container.innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 fade-in"><div class="bg-white p-6 rounded-xl shadow-sm border"><h3 class="text-lg font-semibold mb-4 border-b pb-2">Classes</h3><div class="flex gap-2 mb-4"><input type="text" id="new-class-input" placeholder="e.g. Class 1" class="flex-1 px-3 py-2 border rounded-lg text-sm"><button onclick="handleAddClass()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">Add</button></div><ul id="classes-list" class="space-y-2"></ul></div><div class="bg-white p-6 rounded-xl shadow-sm border"><h3 class="text-lg font-semibold mb-4 border-b pb-2">Subjects</h3><div class="flex gap-2 mb-4"><input type="text" id="new-subject-input" placeholder="e.g. Accountancy" class="flex-1 px-3 py-2 border rounded-lg text-sm"><button onclick="handleAddSubject()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm">Add</button></div><ul id="subjects-list" class="space-y-2"></ul></div></div>';
    updateAcademicLists();
}
function updateAcademicLists() {
    var cl = document.getElementById('classes-list'), sl = document.getElementById('subjects-list');
    if (!cl || !sl) return;
    cl.innerHTML = state.classes.map(function(c, i) {
        if (editingClassIndex === i) return '<li class="flex gap-2 items-center bg-blue-50 p-2 rounded border"><input type="text" id="edit-class-input-' + i + '" value="' + c + '" class="flex-1 px-2 py-1.5 text-sm border rounded"><button onclick="saveEditClass(' + i + ',\'' + c.replace(/\'/g, "\\'") + '\')" class="text-green-600 p-2"><i class="fas fa-check"></i></button><button onclick="cancelEditClass()" class="text-gray-500 p-2"><i class="fas fa-times"></i></button></li>';
        if (confirmDeleteClassIndex === i) return '<li class="flex justify-between items-center bg-red-50 p-3 rounded border text-sm"><span>Delete ' + c + '?</span><div class="flex gap-2"><button onclick="executeDeleteClass(' + i + ',\'' + c.replace(/\'/g, "\\'") + '\')" class="bg-red-600 text-white px-3 py-1 rounded">Yes</button><button onclick="cancelDeleteClass()" class="bg-gray-300 px-3 py-1 rounded">No</button></div></li>';
        return '<li class="flex justify-between items-center bg-gray-50 p-3 rounded border"><span class="text-sm font-medium">' + c + '</span><div class="flex gap-2"><button onclick="startEditClass(' + i + ')" class="text-blue-500 p-1"><i class="fas fa-edit"></i></button><button onclick="startDeleteClass(' + i + ')" class="text-red-400 p-1"><i class="fas fa-trash"></i></button></div></li>';
    }).join('');
    sl.innerHTML = state.subjects.map(function(s, i) {
        if (editingSubjectIndex === i) return '<li class="flex gap-2 items-center bg-green-50 p-2 rounded border"><input type="text" id="edit-subject-input-' + i + '" value="' + s + '" class="flex-1 px-2 py-1.5 text-sm border rounded"><button onclick="saveEditSubject(' + i + ',\'' + s.replace(/\'/g, "\\'") + '\')" class="text-green-600 p-2"><i class="fas fa-check"></i></button><button onclick="cancelEditSubject()" class="text-gray-500 p-2"><i class="fas fa-times"></i></button></li>';
        if (confirmDeleteSubjectIndex === i) return '<li class="flex justify-between items-center bg-red-50 p-3 rounded border text-sm"><span>Delete?</span><div class="flex gap-2"><button onclick="executeDeleteSubject(' + i + ',\'' + s.replace(/\'/g, "\\'") + '\')" class="bg-red-600 text-white px-3 py-1 rounded">Yes</button><button onclick="cancelDeleteSubject()" class="bg-gray-300 px-3 py-1 rounded">No</button></div></li>';
        return '<li class="flex justify-between items-center bg-gray-50 p-3 rounded border"><span class="text-sm font-medium">' + s + '</span><div class="flex gap-2"><button onclick="startEditSubject(' + i + ')" class="text-green-500 p-1"><i class="fas fa-edit"></i></button><button onclick="startDeleteSubject(' + i + ')" class="text-red-400 p-1"><i class="fas fa-trash"></i></button></div></li>';
    }).join('');
}
function handleAddClass() { var v = document.getElementById('new-class-input').value.trim(); if (!v) return; if (state.classes.indexOf(v) > -1) { showToast("Exists!", "error"); return; } state.classes.push(v); document.getElementById('new-class-input').value = ''; saveState(true, 'meta'); updateAcademicLists(); showToast("Added!", "success"); }
function startEditClass(i) { editingClassIndex = i; confirmDeleteClassIndex = -1; updateAcademicLists(); }
function cancelEditClass() { editingClassIndex = -1; updateAcademicLists(); }
function saveEditClass(i, old) { var v = document.getElementById('edit-class-input-' + i).value.trim(); if (v && v !== old && state.classes.indexOf(v) === -1) { state.classes[i] = v; var session = getActiveSessionData(); session.students.forEach(function(s) { if (s.className === old) s.className = v; }); state.teachers.forEach(function(t) { t.assignments.forEach(function(a) { if (a.className === old) a.className = v; }); if (t.classTeacherOf) { var idx = t.classTeacherOf.indexOf(old); if (idx > -1) t.classTeacherOf[idx] = v; } }); saveState(true, 'meta'); saveState(true, 'students'); saveState(true, 'teachers'); showToast("Updated!", "success"); } cancelEditClass(); }
function startDeleteClass(i) { confirmDeleteClassIndex = i; editingClassIndex = -1; updateAcademicLists(); }
function cancelDeleteClass() { confirmDeleteClassIndex = -1; updateAcademicLists(); }
function executeDeleteClass(i) { var del = state.classes[i]; state.classes.splice(i, 1); state.teachers.forEach(function(t) { t.assignments = t.assignments.filter(function(a) { return a.className !== del; }); if (t.classTeacherOf) t.classTeacherOf = t.classTeacherOf.filter(function(c) { return c !== del; }); }); saveState(true, 'meta'); saveState(true, 'teachers'); showToast("Deleted", "info"); cancelDeleteClass(); }
function handleAddSubject() { var v = document.getElementById('new-subject-input').value.trim(); if (v && state.subjects.indexOf(v) === -1) { state.subjects.push(v); document.getElementById('new-subject-input').value = ''; saveState(true, 'meta'); updateAcademicLists(); showToast("Added!", "success"); } }
function startEditSubject(i) { editingSubjectIndex = i; confirmDeleteSubjectIndex = -1; updateAcademicLists(); }
function cancelEditSubject() { editingSubjectIndex = -1; updateAcademicLists(); }
function saveEditSubject(i, old) { var v = document.getElementById('edit-subject-input-' + i).value.trim(); if (v && v !== old && state.subjects.indexOf(v) === -1) { state.subjects[i] = v; saveState(true, 'meta'); showToast("Updated!", "success"); } cancelEditSubject(); }
function startDeleteSubject(i) { confirmDeleteSubjectIndex = i; editingSubjectIndex = -1; updateAcademicLists(); }
function cancelDeleteSubject() { confirmDeleteSubjectIndex = -1; updateAcademicLists(); }
function executeDeleteSubject(i) { state.subjects.splice(i, 1); saveState(true, 'meta'); showToast("Deleted", "info"); cancelDeleteSubject(); }

function renderSubjectManagement(container) {
    container.innerHTML = '<div class="fade-in flex flex-col h-full gap-4"><div class="flex overflow-x-auto border-b bg-gray-50 hide-scrollbar rounded-t-xl"><button onclick="switchSubMgtTab(\'lower\')" id="sub-tab-lower" class="sub-mgt-tab px-6 py-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 whitespace-nowrap">Basic (1-8)</button><button onclick="switchSubMgtTab(\'higher\')" id="sub-tab-higher" class="sub-mgt-tab px-6 py-3 text-sm font-medium text-gray-500 border-b-2 border-transparent whitespace-nowrap">Secondary (9-12)</button><button onclick="switchSubMgtTab(\'credit-hour\')" id="sub-tab-credit-hour" class="sub-mgt-tab px-6 py-3 text-sm font-medium text-gray-500 border-b-2 border-transparent whitespace-nowrap">Credit Hours</button></div><div id="sub-mgt-content" class="flex-1 min-w-0 bg-white border rounded-b-xl p-4 shadow-sm overflow-y-auto"></div></div>';
    switchSubMgtTab('lower');
}
function switchSubMgtTab(level) {
    document.querySelectorAll('.sub-mgt-tab').forEach(function(el) { el.classList.remove('text-blue-600', 'border-blue-600', 'font-semibold'); el.classList.add('text-gray-500', 'border-transparent', 'font-medium'); });
    var at = document.getElementById('sub-tab-' + level);
    if (at) { at.classList.remove('text-gray-500', 'border-transparent', 'font-medium'); at.classList.add('text-blue-600', 'border-blue-600', 'font-semibold'); }
    var c = document.getElementById('sub-mgt-content');
    if (level === 'lower') renderSubMgtLower(c);
    else if (level === 'higher') renderSubMgtHigher(c);
    else if (level === 'credit-hour') renderCreditHourMgmt(c);
}
function renderSubMgtLower(container) {
    var opts = state.classes.filter(isClassLower).map(c => '<option value="' + c + '">' + c + '</option>').join('');
    container.innerHTML = '<div class="max-w-4xl mx-auto flex flex-col h-full"><div class="mb-4 shrink-0"><select id="exam-sub-class-lower" class="px-4 py-2 border rounded-lg text-sm bg-white" onchange="loadExamSubjectsLower()"><option value="">Select Class (1-8)</option>' + opts + '</select></div><div id="exam-sub-container-lower" class="flex-1 min-h-0"><p class="text-gray-500 text-center py-8">Select class.</p></div></div>';
}
function loadExamSubjectsLower() {
    var cls = document.getElementById('exam-sub-class-lower').value;
    var c = document.getElementById('exam-sub-container-lower');
    if (!cls) { c.innerHTML = ''; return; }
    if (!state.examSettings.classSubjects) state.examSettings.classSubjects = {};
    var sel = state.examSettings.classSubjects[cls] || [];
    var rows = state.subjects.map(s => '<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 w-16 text-center"><input type="checkbox" class="exam-sub-checkbox w-4 h-4" value="' + s + '"' + (sel.indexOf(s) > -1 ? ' checked' : '') + '></td><td class="px-4 py-3 text-sm">' + s + '</td></tr>').join('');
    c.innerHTML = '<div class="bg-white border rounded shadow-sm overflow-hidden mb-4"><div class="overflow-y-auto max-h-96"><table class="w-full text-left"><thead class="bg-gray-100 text-xs uppercase sticky top-0"><tr><th class="px-4 py-3 text-center">Select</th><th class="px-4 py-3">Subject</th></tr></thead><tbody>' + rows + '</tbody></table></div></div><div class="flex justify-end mt-4"><button onclick="saveExamSubjects(\'' + cls + '\')" class="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm">Save</button></div>';
}
function saveExamSubjects(cls) { var cbs = document.querySelectorAll('.exam-sub-checkbox:checked'); if (!state.examSettings.classSubjects) state.examSettings.classSubjects = {}; state.examSettings.classSubjects[cls] = Array.from(cbs).map(cb => cb.value); saveState(true, 'meta'); showToast("Saved!", "success"); }
function renderSubMgtHigher(container) {
    var opts = state.classes.filter(isClassHigher).map(c => '<option value="' + c + '">' + c + '</option>').join('');
    container.innerHTML = '<div class="max-w-4xl mx-auto flex flex-col h-full"><div class="mb-4 shrink-0"><select id="exam-sub-class-higher" class="px-4 py-2 border rounded-lg text-sm bg-white" onchange="loadExamSubjectsHigher()"><option value="">Select Class (9-12)</option>' + opts + '</select></div><div id="exam-sub-container-higher" class="flex-1 min-h-0 flex flex-col"><p class="text-gray-500 text-center py-8">Select class.</p></div></div>';
}
function loadExamSubjectsHigher() {
    var cls = document.getElementById('exam-sub-class-higher').value;
    var c = document.getElementById('exam-sub-container-higher');
    if (!cls) return;
    var session = getActiveSessionData();
    var studs = session.students.filter(s => s.className === cls);
    if (!studs.length) { c.innerHTML = 'No students.'; return; }
    var comp = (state.examSettings.compulsorySubjects && state.examSettings.compulsorySubjects[cls]) || [];
    var bulk = '<div class="mb-4 p-3 border rounded bg-gray-50 shrink-0"><h4 class="font-bold text-sm mb-2">Bulk Compulsory</h4><div class="flex flex-wrap gap-2 mb-3">' + state.subjects.map(s => '<label class="bg-white px-2 py-1 rounded border text-xs"><input type="checkbox" class="bulk-sub-cb h-3 w-3 mr-1" value="' + s + '"' + (comp.indexOf(s) > -1 ? ' checked' : '') + '>' + s + '</label>').join('') + '</div><button onclick="bulkAssignSubjects(\'' + cls + '\')" class="bg-blue-800 text-white px-3 py-1.5 rounded text-xs">Apply to All</button></div>';
    var list = studs.map(function(s) {
        var assigned = (state.examSettings.studentSubjects && state.examSettings.studentSubjects[s.id]) || [];
        return '<div class="border rounded p-3 bg-white mb-2 student-row" data-student-id="' + s.id + '"><div class="flex justify-between border-b pb-2 mb-2"><span class="text-sm font-bold">' + s.name + ' <span class="text-xs text-gray-500">(' + s.id + ')</span></span><button onclick="saveStudentSubjects(\'' + s.id + '\')" class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded">Save</button></div><div class="flex flex-wrap gap-2">' + state.subjects.map(sub => '<label class="text-xs bg-gray-50 border rounded px-1.5 py-0.5"><input type="checkbox" class="h-3 w-3 mr-1 student-sub-cb-' + s.id + '" value="' + sub + '"' + (assigned.indexOf(sub) > -1 ? ' checked' : '') + '>' + sub + '</label>').join('') + '</div></div>';
    }).join('');
    c.innerHTML = bulk + '<div class="flex-1 overflow-y-auto custom-scrollbar">' + list + '</div><div class="mt-3"><button onclick="saveAllStudentSubjects(\'' + cls + '\')" class="w-full bg-green-600 text-white px-4 py-2 rounded text-sm font-bold">Save All</button></div>';
}
function bulkAssignSubjects(cls) {
    var sel = Array.from(document.querySelectorAll('.bulk-sub-cb:checked')).map(cb => cb.value);
    if (!state.examSettings.compulsorySubjects) state.examSettings.compulsorySubjects = {};
    state.examSettings.compulsorySubjects[cls] = sel;
    if (!state.examSettings.studentSubjects) state.examSettings.studentSubjects = {};
    var session = getActiveSessionData();
    session.students.filter(s => s.className === cls).forEach(function(s) {
        var row = document.querySelector('.student-row[data-student-id="' + s.id + '"]');
        if (row) row.querySelectorAll('input[type="checkbox"]').forEach(function(cb) { if (sel.indexOf(cb.value) > -1) cb.checked = true; });
        var ex = state.examSettings.studentSubjects[s.id] || [];
        state.examSettings.studentSubjects[s.id] = Array.from(new Set([...ex, ...sel]));
    });
    showToast("Bulk applied");
}
async function saveStudentSubjects(id) { if (!state.examSettings.studentSubjects) state.examSettings.studentSubjects = {}; state.examSettings.studentSubjects[id] = Array.from(document.querySelectorAll('.student-sub-cb-' + id + ':checked')).map(cb => cb.value); await saveState(true, 'meta'); showToast("Saved!", "success"); }
async function saveAllStudentSubjects(cls) { var session = getActiveSessionData(); session.students.filter(s => s.className === cls).forEach(function(s) { if (!state.examSettings.studentSubjects) state.examSettings.studentSubjects = {}; state.examSettings.studentSubjects[s.id] = Array.from(document.querySelectorAll('.student-sub-cb-' + s.id + ':checked')).map(cb => cb.value); }); await saveState(true, 'meta'); showToast("All saved!", "success"); }
function renderCreditHourMgmt(container) {
    var levels = ['Class 1-3', 'Class 4-5', 'Class 6-8', 'Class 9-10', 'Class 11-12'];
    var opts = levels.map(l => '<option value="' + l + '">' + l + '</option>').join('');
    container.innerHTML = '<div class="max-w-4xl mx-auto flex flex-col h-full"><div class="mb-4 shrink-0"><select id="credit-hour-level" class="px-4 py-2 border rounded-lg text-sm bg-white" onchange="loadCreditHours()"><option value="">Select Level</option>' + opts + '</select></div><div id="credit-hour-container" class="flex-1 min-h-0 flex flex-col"><p class="text-gray-500 text-center py-8">Select level.</p></div></div>';
}
function loadCreditHours() {
    var level = document.getElementById('credit-hour-level').value;
    var c = document.getElementById('credit-hour-container');
    if (!level) { c.innerHTML = ''; return; }
    var map = { 'Class 1-3': [1, 2, 3], 'Class 4-5': [4, 5], 'Class 6-8': [6, 7, 8], 'Class 9-10': [9, 10], 'Class 11-12': [11, 12] };
    var nums = map[level];
    var classes = state.classes.filter(cl => { var m = String(cl).match(/\d+/); return m && nums.indexOf(parseInt(m[0], 10)) > -1; });
    var allSubs = new Set();
    classes.forEach(cl => getSubjectsForClass(cl).forEach(s => allSubs.add(s)));
    var subs = Array.from(allSubs);
    if (!subs.length) { c.innerHTML = '<div class="bg-yellow-50 border border-yellow-200 text-yellow-700 p-3 rounded text-sm">No subjects.</div>'; return; }
    if (!state.examSettings.creditHours) state.examSettings.creditHours = {};
    var ex = state.examSettings.creditHours[level] || {};
    var rows = subs.map(s => '<tr class="border-b hover:bg-gray-50"><td class="px-4 py-3 text-sm">' + s + '</td><td class="px-4 py-3 text-center"><input type="number" step="0.5" min="0" class="credit-input w-24 px-2 py-1.5 border rounded text-center text-sm" data-subject="' + s.replace(/"/g, '&quot;') + '" value="' + (ex[s] !== undefined ? ex[s] : '') + '"></td></tr>').join('');
    c.innerHTML = '<div class="bg-blue-50 text-blue-800 p-3 rounded border text-sm mb-4"><i class="fas fa-clock mr-1"></i> Credit Hours for ' + level + '</div><div class="bg-white border rounded shadow-sm overflow-hidden mb-4"><div class="overflow-y-auto max-h-96"><table class="w-full text-left"><thead class="bg-gray-100 text-xs uppercase sticky top-0"><tr><th class="px-4 py-3">Subject</th><th class="px-4 py-3 text-center">Credit</th></tr></thead><tbody>' + rows + '</tbody></table></div></div><div class="flex justify-end mt-4"><button onclick="saveCreditHours(\'' + level + '\')" class="bg-green-600 text-white px-6 py-2.5 rounded-lg text-sm font-bold"><i class="fas fa-save mr-1"></i>Save</button></div>';
}
function saveCreditHours(level) {
    if (!state.examSettings.creditHours) state.examSettings.creditHours = {};
    state.examSettings.creditHours[level] = {};
    var n = 0;
    document.querySelectorAll('.credit-input').forEach(function(inp) { var s = inp.getAttribute('data-subject'); var v = parseFloat(inp.value); if (!isNaN(v)) { state.examSettings.creditHours[level][s] = v; n++; } });
    saveState(true, 'meta');

    container.innerHTML = '<div class="bg-white p-4 rounded-xl shadow-sm border mb-4 flex flex-col sm:flex-row gap-3 items-end"><div class="w-full sm:w-[15%]"><label class="block text-xs font-medium mb-1">Year</label><input type="text" id="att-year" value="' + yr + '" readonly class="w-full p-2 border rounded text-sm bg-gray-100"></div><div class="w-full sm:w-[35%] flex gap-2"><div class="w-1/2"><label class="block text-xs font-medium mb-1">From</label><select id="att-month-from" onchange="document.getElementById(\'att-month-to\').value=this.value" class="w-full p-2 border rounded text-sm bg-white">' + mOpts + '</select></div><div class="w-1/2"><label class="block text-xs font-medium mb-1">To</label><select id="att-month-to" class="w-full p-2 border rounded text-sm bg-white">' + mOpts + '</select></div></div><div class="w-full sm:w-[25%]"><label class="block text-xs font-medium mb-1">Class</label><select id="att-class" class="w-full p-2 border rounded text-sm bg-white"><option value="">Select</option>' + cOpts + '</select></div><div class="w-full sm:w-[25%]"><button onclick="loadAttendanceList()" class="w-full bg-blue-600 text-white py-2 rounded text-sm font-medium">Load</button></div></div><div id="attendance-table-container" class="hidden bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col min-h-[400px]"><div class="p-4 border-b flex flex-col sm:flex-row justify-between items-center bg-gray-50 gap-3"><h3 class="font-semibold text-sm" id="attendance-list-title">Attendance</h3><div class="flex gap-2" id="att-action-container"></div></div><div class="overflow-auto custom-scrollbar flex-1"><table class="w-full text-sm text-left whitespace-nowrap border-collapse min-w-max" id="attendance-table"><thead class="bg-gray-100 uppercase text-xs sticky top-0 z-10" id="att-thead"></thead><tbody id="att-tbody"></tbody></table></div></div>';
}
function loadAttendanceList() {
    var year = document.getElementById('att-year').value;
    var mFrom = document.getElementById('att-month-from').value;
    var mTo = document.getElementById('att-month-to').value;
    var cls = document.getElementById('att-class').value;
    if (!year || !mFrom || !mTo || !cls) { showToast('Select Year, Months, and Class', 'error'); return; }
    var fi = state.months.indexOf(mFrom); var ti = state.months.indexOf(mTo);
    if (fi > ti) { showToast('From cannot be later', 'error'); return; }
    var mons = state.months.slice(fi, ti + 1);
    var isRange = mons.length > 1;
    var session = getActiveSessionData();
    var studs = session.students.filter(s => s.className === cls);
    var cont = document.getElementById('attendance-table-container');
    var tb = document.getElementById('att-tbody');
    var th = document.getElementById('att-thead');
    if (!studs.length) { showToast('No students', 'error'); cont.classList.add('hidden'); return; }
    var isAdmin = state.currentUser.role === 'admin';
    var canEdit = !isAdmin && !isRange;
    var btns = canEdit ? '<button onclick="exportAttendanceExcel()" class="bg-green-600 text-white px-3 py-1.5 rounded text-sm font-bold"><i class="fas fa-file-excel mr-1"></i>Export</button><button onclick="saveAttendance()" class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm font-bold"><i class="fas fa-save mr-1"></i>Save</button>' : '<button onclick="exportAttendanceExcel()" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-bold"><i class="fas fa-file-excel mr-1"></i>Export Report</button>';
    document.getElementById('att-action-container').innerHTML = btns;
    currentAttendanceContext = { year: year, monthFrom: mFrom, monthTo: mTo, cls: cls, students: studs, selectedMonths: mons, canEdit: canEdit };
    document.getElementById('attendance-list-title').innerText = isRange ? cls + ' - ' + mFrom + ' to ' + mTo + ' ' + year : cls + ' - ' + mFrom + ' ' + year;
    var thead = '';
    if (isRange) { thead += '<tr><th class="px-4 py-3 border bg-gray-100">S.N.</th><th class="px-4 py-3 border bg-gray-100">ID</th><th class="px-4 py-3 border bg-gray-100">Name</th>'; mons.forEach(m => { thead += '<th class="px-3 py-3 border text-center bg-gray-200">' + m.toUpperCase() + '</th>'; }); thead += '<th class="px-3 py-3 border text-center bg-blue-100">OVERALL</th></tr>'; }
    else thead += '<tr><th class="px-4 py-3 border">S.N.</th><th class="px-4 py-3 border">ID</th><th class="px-4 py-3 border">Name</th><th class="px-4 py-3 border text-center">Present</th></tr>';
    th.innerHTML = thead;
    var tbHtml = '';
    studs.forEach(function(s, i) {
        var r = '<tr class="hover:bg-gray-50 border-b"><td class="px-4 py-2 border text-center text-gray-500">' + (i + 1) + '</td><td class="px-4 py-2 border font-medium">' + s.id + '</td><td class="px-4 py-2 border font-semibold">' + s.name + '</td>';
        if (isRange) { var sum = 0, hd = false; mons.forEach(function(m) { var rec = session.attendance.find(a => a.studentId === s.id && a.year === year && a.month === m); if (rec && rec.presentDays !== '' && rec.presentDays !== undefined) { hd = true; var p = parseInt(rec.presentDays, 10) || 0; sum += p; r += '<td class="px-3 py-2 border text-center font-medium">' + p + '</td>'; } else r += '<td class="px-3 py-2 border text-center text-gray-300">-</td>'; }); r += '<td class="px-3 py-2 border text-center font-bold bg-blue-50/50">' + (hd ? sum : '-') + '</td>'; }
        else { var m = mons[0]; var rec = session.attendance.find(a => a.studentId === s.id && a.year === year && a.month === m); var p = rec && rec.presentDays !== undefined ? rec.presentDays : ''; var inp = !canEdit ? '<span class="font-medium">' + (p !== '' ? p : '-') + '</span>' : '<input type="number" min="0" class="att-present-days w-full px-2 py-1.5 border rounded text-center text-sm" data-sid="' + s.id + '" value="' + p + '">'; r += '<td class="px-2 py-2 border text-center bg-white">' + inp + '</td>'; }
        r += '</tr>';
        tbHtml += r;
    });
    tb.innerHTML = tbHtml;
    cont.classList.remove('hidden');
}
async function saveAttendance() {
    if (!currentAttendanceContext || !currentAttendanceContext.canEdit) return;
    var c = currentAttendanceContext;
    var session = getActiveSessionData();
    var n = 0;
    c.students.forEach(function(s) { var el = document.querySelector('.att-present-days[data-sid="' + s.id + '"]'); if (el && el.value !== '') { var pd = parseInt(el.value, 10) || 0; var idx = session.attendance.findIndex(a => a.studentId === s.id && a.year === c.year && a.month === c.monthFrom); if (idx > -1) session.attendance[idx].presentDays = pd; else session.attendance.push({ studentId: s.id, year: c.year, month: c.monthFrom, presentDays: pd }); n++; } });
    await saveState(true, 'attendance');
    showToast('Saved ' + n + ' students!', 'success');
}
function exportAttendanceExcel() {
    if (!currentAttendanceContext) { showToast('Load first', 'error'); return; }
    var c = currentAttendanceContext;
    var isRange = c.selectedMonths.length > 1;
    var session = getActiveSessionData();
    var data = c.students.map(function(s, i) {
        var row = { "S.N.": i + 1, "Student ID": s.id, "Name": s.name, "Class": c.cls, "Year": c.year };
        if (isRange) { var sum = 0, hd = false; c.selectedMonths.forEach(function(m) { var rec = session.attendance.find(a => a.studentId === s.id && a.year === c.year && a.month === m); if (rec && rec.presentDays !== undefined) { hd = true; var p = parseInt(rec.presentDays, 10) || 0; sum += p; row[m] = p; } else row[m] = '-'; }); row["Overall"] = hd ? sum : '-'; }
        else { var rec2 = session.attendance.find(a => a.studentId === s.id && a.year === c.year && a.month === c.monthFrom); row["Month"] = c.monthFrom; row["Present"] = rec2 ? (rec2.presentDays || 0) : '-'; }
        return row;
    });
    var ws = XLSX.utils.json_to_sheet(data);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Attendance");
    var ms = isRange ? c.monthFrom + '_to_' + c.monthTo : c.monthFrom;
    XLSX.writeFile(wb, 'Attendance_' + c.cls.replace(/\s+/g, '_') + '_' + ms + '_' + c.year + '.xlsx');
    showToast('Downloaded!', 'success');
}
window.renderStudentAttendance = renderStudentAttendance;
window.loadAttendanceList = loadAttendanceList;
window.saveAttendance = saveAttendance;
window.exportAttendanceExcel = exportAttendanceExcel;

    if (!state.examSettings.admitCardPerPage) state.examSettings.admitCardPerPage = '4';

    if (!state.sessions || Object.keys(state.sessions).length === 0) {
        var y = String(state.examSettings.academicYear || '2083');
        state.sessions = {}; state.sessions[y] = createEmptySession(y);
        state.activeSession = y;
    }
    if (!state.activeSession) state.activeSession = Object.keys(state.sessions)[0];
    ensureSessionExists(state.activeSession);

    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(persistableState())); } catch (e) {}

    setInterval(function() { if (dirtySections.size > 0) saveState(false); }, 30000);
    window.addEventListener('beforeunload', function() { if (dirtySections.size > 0) saveState(true); });

    if (loadSession() && state.currentUser) {
        if (state.currentUser.role === 'teacher') {
            var ft = state.teachers.find(t => t.id === state.currentUser.id);
            if (ft) state.currentUser = Object.assign({}, ft, { role: 'teacher', impersonating: state.currentUser.impersonating, studentPermissions: ft.studentPermissions || { add: true, edit: true, delete: true } });
        }
        if (state.currentUser && state.currentUser.role) {
            setTimeout(function() { loadApp(); }, 400);
        }
    }
})();
